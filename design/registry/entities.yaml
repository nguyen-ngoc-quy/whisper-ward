    value: origin-only-launch-vector-pure
    safe_range: "enum: origin-only-launch-vector-pure"
    note: "The Burst projectile's initial velocity vector is computed solely from BurstThrowConfig (v0 magnitude) and the captured camera azimuth (XZ direction). The thrower's own run/crouch velocity does NOT add to the projectile's initial velocity; it affects only the origin position sampled at the input-edge instant. Any 'thrower kinetic contribution' or 'drag' is a violation that fails closed at fixture validation. Runtime, preview, and LevelFixture all use the same composition."
