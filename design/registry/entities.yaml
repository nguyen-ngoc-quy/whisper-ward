    safe_range: "enum: two-timestamp-split (rev 2026-08-31; single input-edge-capture-time value is STRUCK)"
    note: "Rev 2026-08-31 (clean full re-review): a Burst fact carries TWO virtual-time fields with distinct roles. (1) source_timestamp = the Throw input-edge capture time — the ALLOCATION AND ORDERING KEY ONLY (deterministic same-timestamp allocation order (source_timestamp, source_event_class_rank, source_event_id), dedup identity, replay comparison); it is NEVER the F2b deadline anchor — every MVP flight lasts ~0.25–1.5 s, so anchoring the T_hearing deadline at the input edge would reject every Burst fact at admission. (2) terminal_publication_time = the absolute virtual time of the flight's terminal resolution — the winning integer fixed-tick boundary (start_tick + winning_tick) × dt_max on Collision and Timeout, or the death-cancellation time on DeathCancelled; null on BoundaryCancelled (the sub-tick interpolated contact_event_time is a derived diagnostic field and is never the collision publication time, because t_publish is absolute) — for a published Collision/Timeout fact it is the DEADLINE ANCHOR and the T_hearing deadline computes as terminal_publication_time + T_hearing; DeathCancelled and BoundaryCancelled have no t_publish, raw fact, or hearing deadline. Movement facts keep source_timestamp as their deadline anchor (commit time IS publish time). The emitter's committed-order gate is MOVEMENT-SCOPED: a Burst fact is never rejected for source order — its flight legitimately spans multiple movement commits, and its ordering is guaranteed at allocation by the deterministic key; a movement pip committing mid-flight does not disturb the flight's reserved identity. Dedup namespaces are DISJOINT: movement keys in the step: namespace (step_id), Burst keys in the flight: namespace (flight_handle_id), each unique within (session_id, attempt_epoch); a unified cross-class keyset or a per-boundary handle reset without epoch scoping is a validator failure, and a cross-class duplicate rejection diagnostic must name its namespace. The thrower's origin position is captured at the input-edge instant."
    source: design/gdd/player-noise.md  # Pass A revision B — Burst timestamp (2026-08-30); two-timestamp split rev 2026-08-31
    owned_by: "Player Noise GDD"
    consumed_by: [Player Noise GDD, Perception GDD, LevelFixture]
