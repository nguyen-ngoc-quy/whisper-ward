# Whisper Ward — Entity Registry
# Cross-system entities and constants. Values are LOCKED herein; downstream GDDs
# must CONSUME these, never re-declare. Co-owned fields list all owning GDDs.
# Created: 2026-08-18 (Perception GDD — Phase 5b). Registry conflicts surface
# immediately per .claude/docs/coding-standards.md.

formula_definitions:
  - name: accumulator_charge_rate
    expression: "dA/dt = min(k/d, rate_max)"
    source: design/gdd/perception.md  # F1
    output_range: "[0, rate_max] A/s"
    variables: [k, d, rate_max, T_sample]
    note: "d is DUAL-MODE (rev 3.1, ADJ-1): path distance in the catch band (Euclidean <= catch_range + 2 m); Euclidean distance in the delta-band (catch_range + 2 m < Euclidean <= R_vis) with R3 navmesh-sample reachability — no path query runs in the delta-band (F1/R1 closure). d metric pin (rev 3.3, J2): guard-feet -> sampled-player-feet CENTER-TO-CENTER path length; the player is NOT a carved NavMeshObstacle (blocked-destination corners at the capsule edge would shrink d by up to r_player against delta_reach 0.02); pinned in the Technical-Setup sensing ADR"

  - name: entry_threshold
    expression: "T_entry(R) = max(T_base - k_res*R, T_floor)"
    source: design/gdd/perception.md  # F5
    output_range: "[0.04, 0.40] full-knob domain (T_floor min 0.2×0.20 = 0.04 .. T_base max 0.40 at R=0); starter slice [0.06, 0.30]"
    variables: [T_base, k_res, R, T_floor]
    note: "rev 3.6 (CR-FSM-01): Guard AI FSM consumes this formula as its hide-entry tier gate — alias T_hide_entry (renamed to avoid symbol collision with the FSM's former unsourced T_entry); the FSM evaluates T_hide_entry(R) = T_entry(R) at the last pre-break sight tick and compares the LOS-break fact's a_pre_break against threshold_applied (both fields on the hide-dive break event). Domain corrected rev 3.7 (review #4 S4): the derived FULL-KNOB domain is [0.04, 0.40]; [0.06–0.30] is the starter-config slice only — band-checking consumers must use [0.04, 0.40] or they reject/clamp legal configs."
    consumed_by: [Perception GDD, Suspicion/Grade GDD, Guard AI FSM GDD]

  - name: residual_decay
    expression: "R(t) = R(t0) * exp(-(t-t0)/tau_res)"
    source: design/gdd/perception.md  # F4
    output_range: "[0, R_max]"
    variables: [R, tau_res]

  - name: giveup_timeout
    expression: "t_giveup = t_giveup_base * s_diff * (1 + k_thorough * R/R_max)"
    source: design/gdd/perception.md  # F8
    output_range: "[2.45, 16.0] s (full knob domain); starter band [4.0, 6.0] s (base 4.0 × s_diff 1.0 × (1 + k_thorough·R/R_max), R ∈ [0, R_max])"
    variables: [t_giveup_base, s_diff, k_thorough, R, R_max]

  - name: catch_range_invariant
    expression: "catch_range > V_run*T_sample_max + hyst + r_guard + r_player + stopping_distance"
    source: design/gdd/perception.md  # F10
    output_range: "max-of-band 5.05 m < 5.5 m; catch_range floor 5.2 m"
    variables: [catch_range, V_run, T_sample_max, hyst, r_guard, r_player, stopping_distance]
    note: "rev 3.3 (J8): r_guard/r_player are LOCKED constants (0.40/0.35, no safe range — the F10 formula-table operand bands [0.35,0.45]/[0.30,0.40] were stale knob-form and were struck rev 3.3); max-of-band = 7.2*0.5 + 0.7 + 0.40 + 0.35 = 5.05 m. The 5.2 floor is conservative: true margin over max-of-band at the floor is 0.15 m. Every config-time AC reads these constants, never formula-table operand bands."

  - name: chase_speed_ratio
    expression: "V_chase >= 1.10 * V_run(runtime max); starter V_chase = rho_chase * V_run"
    source: design/gdd/perception.md  # F11 (rev 3.2 — V_run overload: runtime-max, starboard V_chase floor 7.92 at band max 7.2)
    output_range: "V_chase >= 7.92 m/s at V_run band max 7.2; starter 6.25 * 1.20 = 7.50 m/s"
    variables: [V_chase, V_run, rho_chase]
    note: "rev 2026-08-26 (/consistency-check G3 reconciliation): starter V_chase 7.50 is PINNED ABSOLUTE per player-third-person-controller.md :321 — the product form above is the HISTORICAL DERIVATION + coordinated-retune rule only; V_chase does NOT auto-scale with V_run. Solo-tuning ceiling V_run <= 6.81 (= 7.50/1.10, see V_run note rev 2026-08-25); crossing it requires a coordinated V_chase retune re-passing this invariant. The '>= 7.92 at band max' line is the requirement AT that corner if ever reached via coordinated retune — not an automatic consequence."

constants:
  - name: T_base
    value: 0.30
    safe_range: "[0.20, 0.40]"
    source: design/gdd/perception.md  # F5; prototype-validated
    consumed_by: [Perception GDD, Suspicion/Grade GDD]

  - name: T_chase
    value: 1.00
    safe_range: "[0.85, 1.00]"  # ≡ A_max — meter scale caps the threshold; > 1.00 is unreachable by the accumulator
    alias_of: A_max
    source: design/gdd/perception.md  # F1/F2/F9; prototype-validated
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: T_floor
    value: 0.06  # starter value at T_base 0.30 — the LOCK is the relation, not a literal
    locked: true  # C-6 pin: floor is NOT a knob
    relation: "T_floor = 0.2 * T_base (derived; value moves with T_base — [0.04, 0.08] across the T_base domain)"
    derived: true
    source: design/gdd/perception.md  # F5
    consumed_by: [Perception GDD, Suspicion/Grade GDD]

  - name: forgiveness_floor
    value: 0.030  # recommended starter; owned by Suspicion/Grade GDD
    safe_range: "DERIVED band [0.05*T_base, 0.2*T_base) — starter [0.015, 0.06), rec 0.030"  # upper edge = T_floor equality forbidden; band tracks the derived T_floor
    constraint: "0 <= forgiveness_floor < T_floor (T_floor = 0.2*T_base, dynamic [0.04, 0.08]); margin (T_floor - ff) in (0, 0.15*T_base]"
    source: design/gdd/perception.md  # F15 (revision 3 — floor is derived, not literal)
    owned_by: "Suspicion/Grade GDD (co-sign)"
    consumed_by: [Perception GDD, Suspicion/Grade GDD]

  - name: k
    value: 1.50
    safe_range: "[1.0, 2.0]"
    source: design/gdd/perception.md  # F1
    consumed_by: [Perception GDD]

  - name: rate_max
    value: 0.60
    safe_range: "[0.40, 0.80]"
    source: design/gdd/perception.md  # F1
    consumed_by: [Perception GDD]

  - name: r_res
    value: 0.10
    safe_range: "[0.05, 0.15]"
    source: design/gdd/perception.md  # F3
    consumed_by: [Perception GDD]

  - name: tau_res
    value: 16  # s
    safe_range: "[12, 20] s"
    source: design/gdd/perception.md  # F4
    consumed_by: [Perception GDD]

  - name: k_res
    value: 0.24
    safe_range: "[0.15, 0.30]"
    source: design/gdd/perception.md  # F5
    consumed_by: [Perception GDD]

  - name: R_max
    value: 1.00
    safe_range: "[0.5, 1.0]"
    source: design/gdd/perception.md  # F3/F9
    consumed_by: [Perception GDD, Suspicion/Grade GDD, Guard AI FSM GDD]  # FSM D1 t_giveup(R) + t_hide_entry(R) derivation consume R_max (rev 3.6 lock-step)

  - name: t_win
    value: 1.2  # s
    safe_range: "[1.0, 2.0] s"
    constraint: "t_win >= 2 * T_sample_max (locked floor 1.0 s); t_win < t_giveup"
    source: design/gdd/perception.md  # F7
    consumed_by: [Perception GDD]

  - name: t_giveup_base
    value: 4.0  # s; prototype-validated
    safe_range: "[3.5, 5.0] s"
    source: design/gdd/perception.md  # F8
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: t_giveup_chase
    value: 8.0  # s — chase give-up window (FSM-owned; used in AC-F14 chain)
    safe_range: "[6, 10] s"
    source: design/gdd/perception.md  # Section G / F14 (lock-step with GDD knob 6–10 s)
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: t_cap_chase
    value: 30  # s — cap-forced chase window (FSM-owned)
    safe_range: "[20, 40] s"
    source: design/gdd/perception.md  # Section G / F14 (lock-step with GDD knob 20–40 s)
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: n_resight_cap
    value: 2
    safe_range: "[1, 3]"  # a count, not a duration (AC-F14(2))
    source: design/gdd/perception.md  # Section G / F14/R15 (lock-step with GDD knob 1–3)
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: t_resight_min
    value: 1.0  # s — minimum between re-sights (FSM-owned)
    safe_range: "[1.0, 1.5] s (floor locked 2 x T_sample_max = 1.0 s, F14(2))"
    constraint: "T_sample_max < t_resight_min < t_giveup_chase < t_cap_chase (AC-F14 chain); floor 2 x T_sample_max locked (0.8 violates the locked floor)"
    source: design/gdd/perception.md  # Section G / F14 (lock-step with GDD knob 1.0–1.5 s)
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: k_thorough
    value: 0.50
    safe_range: "[0.25, 1.0]"
    source: design/gdd/perception.md  # F8
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: s_diff
    value: 1.0
    safe_range: "[0.7, 1.6]"
    source: design/gdd/perception.md  # F8
    consumed_by: [Perception GDD, Guard AI FSM GDD]  # FSM D1 t_giveup(R) consumes s_diff (rev 3.6 lock-step)

  - name: T_sample
    value: 0.5  # s (2-5 Hz tick; starter 2 Hz worst-case)
    safe_range: "[0.2, 0.5] s"
    note: "VISION (LOS) cadence bound (rev 2026-08-27, B8): hearing reaction is bounded by T_hearing below, not T_sample — the vision tick stays 2-5 Hz while a dedicated 5 Hz hearing sub-evaluation runs additive to it."
    source: design/gdd/perception.md  # R1/F2/F7
    consumed_by: [Perception GDD, Guard AI FSM GDD, Player Controller GDD, NavMesh GDD]

  - name: T_hearing
    value: 0.2  # s — worst-case hearing-reaction bound, 5 Hz sub-eval cadence (rev 2026-08-27, B8)
    safe_range: "[0.1, 0.3] s"
    note: "Hearing reaction is a 5 Hz staircase, not uniform: t_audible = t_commit + n·T_hearing for n ∈ {0, 1} at the starter 5 Hz quantum, bounded by T_hearing. Perception runs the hearing sub-evaluation additively to the 2-5 Hz vision tick; exact timestamp equality at commit is valid when the event lands on a due sub-eval."
    source: design/gdd/player-noise.md  # CR9/F2 (re-review rev 2026-08-27); perception.md F12/tick-authority amendment
    owned_by: "Perception GDD (Player Noise co-sign)"
    consumed_by: [Perception GDD, Player Noise GDD, Guard AI FSM GDD]

  - name: T_sample_max
    value: 0.5  # s (worst case)
    source: design/gdd/perception.md  # F7/F10/F14
    consumed_by: [Perception GDD, Guard AI FSM GDD, Player Controller GDD]

  - name: t_catch
    value: 1.0  # s
    safe_range: "[1.0, 1.2] s"  # floor locked: 2 * T_sample_max = 1.0 s (F14(8)); 0.6 was a violation
    constraint: "t_catch >= 2 * T_sample_max (locked 1.0) ; t_catch < t_giveup (min 2.45)"
    source: design/gdd/perception.md  # F14(3)/(8)
    owned_by: "Guard AI FSM GDD (Joint)"
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: catch_range
    value: 5.5  # m
    safe_range: "[5.2, 6.5] m"  # floor = max-of-band 5.05 (F10, rev 3.3); 5.0 violates the strict invariant
    constraint: "catch_range > V_run*T_sample_max + hyst + r_guard + r_player + stopping_distance (max-of-band 5.05 m); catch_range >= 5.2"
    source: design/gdd/perception.md  # F10 (C-6 re-validation venue)
    owned_by: "Systems GDD (re-validation gate); Guard AI FSM GDD (execution)"
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: V_run
    value: 6.25  # m/s design value; runtime-max = the maximum speed reachable in the Player Controller's action set, NOT a fixed design number — the band pins the SAME lane as V_chase/V_run >= 1.10 (rev 3.2, F11)
    safe_range: "[5.0, 7.2] m/s pinned band"
    constraint: "V_chase >= 1.10 * V_run(runtime max) — kiting red-line (F11, rev 3.2); at band max 7.2 this means V_chase >= 7.92"
    note: "rev 2026-08-25 (Player Controller F2, Round-2 arithmetic correction): runtime-max DECLARED = 6.25 m/s — the committed action set contains no speed modifiers (diagonal normalized, backpedal_factor <= 1, slew cannot overshoot, no buff channel); any future speed-raising feature must re-declare AND re-run chase/catch invariants in the same changeset. Solo-tuning ceiling 6.81 m/s (safe rounded-down bound from V_chase starter 7.50 / 1.10 = 6.818...): raising V_run above it requires a coordinated V_chase retune re-passing the chase invariant."
    source: design/gdd/perception.md  # F10/F11
    owned_by: "Player Controller GDD"
    consumed_by: [Perception GDD, Player Controller GDD, Guard AI FSM GDD, NavMesh GDD]

  - name: V_patrol
    value: 2.3  # m/s
    safe_range: "[2.0, 2.8] m/s"
    constraint: "V_patrol < V_investigate <= V_run (ordering; V_investigate is the chase approach override)"
    source: design/gdd/perception.md  # Section G (lock-step with GDD knob 2.0–2.8)
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: V_investigate
    value: 5.0  # m/s
    safe_range: "[4.5, 5.5] m/s"
    constraint: "V_patrol < V_investigate <= V_run"
    note: "JOINT-COUPLING (rev 3.3, J8): the three independent safe ranges admit legal corners violating the ordering (e.g. V_investigate 5.5 with V_run 5.0) — the joint constraint must hold in EVERY config and is enforced by the AC-F14(9) joint-coupling leg; V_run's floor 5.0 is the binding upper bound on V_investigate's range"
    source: design/gdd/perception.md  # Section G (lock-step with GDD knob 4.5–5.5)
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: V_chase
    value: 7.50  # m/s starter config
    safe_range: "pinned starter — no auto-scale band; any coordinated retune must satisfy V_chase >= 1.10 * V_run(runtime max)"
    constraint: "PINNED ABSOLUTE at 7.50 (rev 2026-08-26 /consistency-check G3 reconciliation): does NOT auto-scale with V_run — historical derivation 1.20 * 6.25 non-operative (player-third-person-controller.md :321). Solo-tuning ceiling V_run <= 6.81 (= 7.50/1.10, see V_run note); crossing it requires a coordinated V_chase retune re-passing the chase invariant."
    source: design/gdd/guard-ai-fsm.md  # D4 tuning table ("Consumed, never re-derived")
    consumed_by: [Guard AI FSM GDD, Player Controller GDD]

  - name: FOV
    value: 100  # degrees — sensing cone, inclusive (E2)
    safe_range: "[90, 110] deg"
    source: design/gdd/perception.md  # Section G / R2 (lock-step with GDD knob 90–110)
    consumed_by: [Perception GDD, Level GDD]

  - name: delta_FOV_rendered
    value: 5  # degrees — rendered-cone bias margin (sensing cone + 5 deg rendered, AC-R2b)
    safe_range: "[2, 8] deg"
    constraint: "delta_FOV_rendered >= 5 deg committed starter (phase-locked flicker bound, AC-R2d/ADJ-5) — legal range includes 2–4 deg legally-visible-but-not-committed; the committed 5 deg starter satisfies the >=5 floor"
    source: design/gdd/perception.md  # Section G / R2b/R2d (lock-step with GDD knob 2–8)
    consumed_by: [Perception GDD]

  - name: rho_chase
    value: 1.20
    safe_range: "[1.10, 1.35]"
    constraint: "rho_chase > 1.0 (hard kiting red-line); V_chase = rho_chase * V_run(runtime max) (rev 3.2 — F11 overload: V_chase is defined against the runtime-max V_run, so the band's lowest rho 1.10 at band-max 7.2 still floors V_chase >= 7.92)"
    note: "rev 2026-08-26 (/consistency-check): see chase_speed_ratio note — the product form is the coordinated-retune sizing rule only; starter V_chase 7.50 is PINNED ABSOLUTE, no auto-scale (player-third-person-controller.md :321). rho_chase remains the sizing ratio for any future joint retune."
    source: design/gdd/perception.md  # F11
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: hyst
    value: 0.5  # m
    safe_range: "[0.3, 0.7] m"
    source: design/gdd/perception.md  # F10
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: r_guard
    value: 0.40  # m — guard collision radius used in the F10 catch-range invariant
    locked: true  # rev 3.3 (J8): no safe range — the F10 formula-table operand band [0.35, 0.45] was stale knob-form and was struck
    source: design/gdd/perception.md  # F10 (rev 3.2 — declared operand of catch_range_invariant; operand band struck rev 3.3)
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: r_player
    value: 0.35  # m — player collision radius used in the F10 catch-range invariant
    locked: true  # rev 3.3 (J8): no safe range — the F10 formula-table operand band [0.30, 0.40] was stale knob-form and was struck
    source: design/gdd/perception.md  # F10 (rev 3.2 — declared operand of catch_range_invariant; operand band struck rev 3.3)
    consumed_by: [Perception GDD, Player Controller GDD, Guard AI FSM GDD]

  - name: stopping_distance
    value: 0  # m — locked; NavMeshAgent stops at the destination surface
    locked: true
    source: design/gdd/perception.md  # F10 (rev 3.2 — declared operand of catch_range_invariant; NavMeshAgent default)
    consumed_by: [Perception GDD, Guard AI FSM GDD, NavMesh GDD]

  - name: R_noise_share
    value: 0.15
    safe_range: "[0.10, 0.25]"
    constraint: "per-event add = min(R_noise_share, c_noise) (AC-F6) — the EFFECTIVE per-event cap is the smaller, so no literal c_noise <= R_noise_share ordering is required (rev 3.3, J8: at starter c_noise 0.20 > R_noise_share 0.15, so the SHARE is the binding constraint by design; the per-event cap binds only when R_noise_share is tuned above c_noise; AC-F6 asserts effective add <= R_noise_share); R + sum(effective add) <= R_max (bounded-share clamping, AC-R10)"
    source: design/gdd/perception.md  # Section G / F6 (lock-step with GDD knob 0.10–0.25)
    consumed_by: [Perception GDD]

  - name: c_noise
    value: 0.20
    safe_range: "[0.15, 0.30]"
    source: design/gdd/perception.md  # Section G / F6 (lock-step with GDD knob 0.15–0.30)
    consumed_by: [Perception GDD]

  - name: R_vis
    value: 12.0  # m
    safe_range: "[10, 15] m"
    note: "conversion anchor for noise radii (m_per_px = 0.0511)"
    source: design/gdd/perception.md  # F13
    consumed_by: [Perception GDD, Player Noise GDD, Level GDD]

  - name: delta_reach
    value: 0.02
    safe_range: "[0.005, 0.05]"
    source: design/gdd/perception.md  # F2
    consumed_by: [Perception GDD]

  - name: delta_y_tolerance
    value: 1.0  # m — |ΔY| tolerance on the unified reachability fact (rev 3.3, J2): same-surface requires the sampled-player height within this band of the guard's navmesh surface; bounds the ledge/mid-climb livelock (E4)
    safe_range: "[0.5, 2.0] m"
    note: "VISION/CATCH gate only (rev 2026-08-27, B10) — DISTINCT from hearing_y_hard_cutoff below (the hearing soft vertical attenuation domain)."
    source: design/gdd/perception.md  # rev 3.3 R1/R15/E4 (J2)
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: hearing_y_hard_cutoff
    value: 4.0  # m — hard cutoff of the soft Y-delta hearing falloff (rev 2026-08-28): full radius at ΔY = 0, linearly attenuated to zero at |ΔY| = 4.0 m; beyond it remains silent. DISTINCT from delta_y_tolerance 1.0 (vision/catch reachability gate)
    safe_range: "[3, 5] m"
    note: "Soft vertical leg: R_eff = R_noise(kind) × max(0, 1 − |ΔY| / hearing_y_hard_cutoff); hearing uses planar XZ d_noise ≤ R_eff plus the binary E20 Linecast. The name is a hard cutoff for the attenuation domain, not a hard gate at the boundary."
    source: design/gdd/player-noise.md  # CR5/E16 (re-review rev 2026-08-27); perception.md F12 amendment
    owned_by: "Perception GDD (Player Noise co-sign)"
    consumed_by: [Perception GDD, Player Noise GDD]

  - name: cls_displacement_deadzone
    value: 0.10  # m — classifier displacement dead-zone on the R3 perceived position (rev 3.3, J4): breaks with perceived displacement <= this count as stationary
    safe_range: "[0.05, 0.20] m"
    source: design/gdd/perception.md  # rev 3.3 R7 (J4 — classifier basis pin)
    consumed_by: [Perception GDD]

  - name: cls_sweep_yaw
    value: 5.0  # deg — classifier guard-sweep threshold: cumulative-ABSOLUTE guard-head yaw change during the window must exceed this (net rotation rejected); feel-linked to delta_FOV_rendered in legibility docs
    safe_range: "[3.0, 8.0] deg"
    source: design/gdd/perception.md  # rev 3.3 R7 (J4)
    consumed_by: [Perception GDD]

  - name: navmesh_sample_maxdistance
    value: 0.4  # m — NavMesh.SamplePosition maxDistance for the R3 same-surface sample (rev 3.3, J7): >= max authorable navmesh-free lip 0.30 m + margin; < gap to any non-adjacent walkable surface 0.5 m
    locked: true  # engine-pinned (Unity 6 6000.3), declared per R3
    source: design/gdd/perception.md  # rev 3.3 R3/AC-R3 (J7)
    consumed_by: [Perception GDD, NavMesh GDD, Guard AI FSM GDD]  # FSM consumes the same-surface conjunct of the unified reachable fact via the Reachability event (rev 3.6 lock-step)

  - name: f12_noise_origin_offset
    value: 0.25  # m — F12 hearing ray origin above the feet (rev 3.3, J7): raised 0.15 -> 0.25 m so the ray clears a 0.20 m stair riser at close range (no graze-block); stair/30°-slope probes assert in AC-F12
    source: design/gdd/perception.md  # rev 3.3 F12/AC-F12 (J7)
    owned_by: "Player Noise GDD (co-sign)"
    consumed_by: [Perception GDD, Player Noise GDD]

  - name: n_cancel_cap
    value: 3
    safe_range: "[2, 5]"
    notes: |-
      Counts player-caused window-cancels only (rev 3.1, ADJ-2): causal class peek-out increments; guard-sweep breaks are sweep-excluded — the machine's own motion never accrues a witnessed evasion; hide-dive supersedes to the hide-entry path, never double-counts.
      Surfaced as pips on the meter's residual side; a pip's fade waives its count with it (rev 3.1, ADJ-3 decay-together/waive-out) — the cap structurally cannot fire dark (counter >= cap with all pips faded is impossible); residual-consistent decay, segment-end clears both.
      Reset: only on sight-committed Investigate/Chase commit or the cap-forced Investigate; noise/alert Investigates do NOT reset (adjudicated 2026-08-18).
      Cap-forced Investigate is non-grading (D1 never-count clause extension).
    source: design/gdd/perception.md  # R11 (peek-exploit closer)
    consumed_by: [Perception GDD, Guard AI FSM GDD]

  - name: t_sweep_postchase
    value: 2.0  # s — post-Chase LKP sweep duration (give-up w/o capture → short Investigate-style sweep at LKP, then Patrol; AC-FSM-9)
