trace_event_schema:
  source: design/gdd/perception.md  # R12 v3.2 (C-4 pin); rev 3.2 = escalation-commit junction (blocker B3) + confirm-window-elapsed/cap-reached facts; schema with Telemetry GDD
  direction_note: "Perception publishes sensing FACTS (LOS gain/break, noise relay, threshold-crossing, confirm-window-elapsed, chase-reached, cap-reached, reachability [rev 3.3 — J2: the un-gated per-tick reachable|unreachable verdict, SINGLE source for the F2 Chase-cap, the R15 give-up predicate, and the catch-gate geometry]); Guard AI FSM publishes DECISIONS (investigate-commit on every episode-OPENING path, Chase-entry [rev 3.3 — the FSM's Chase decision record; the meter's Chase row triggers on it so A/R freeze on ALL Chase paths incl. hide-entry and carve-out], Chase-end, Investigate-resolution, peer-recruit, locked-zone, Capture) — Perception never publishes an escalation; the FSM acts on Perception's facts and Perception consumes the FSM's decision facts (event-not-command holds in both directions — neither calls the other, R12 rev 3.3). Suppression rule (rev 3.3, J1; tier-scoped rev 3.4): the FSM publishes exactly one escalation decision per escalation tier — an episode's first in that tier, never a same-tier duplicate (investigate-commit at the Investigate tier, Chase-entry at the Chase tier); an episode that commits Investigate and later reaches Chase publishes BOTH records, in that order (AC-R8 positive leg / AC-F9); a confirm-window commit absorbed into a live episode emits no second record (ADJ-4). Each record carries its publisher class. entry_id is allocated by Perception at episode open (threshold-crossing, or first LOS, or first noise-heard of an episode [rev 3.3, J3], or the direct hide-entrance Chase open [rev 3.2]) and relayed — never allocated — by the FSM on decision records. Guard-head yaw is a Perception INPUT (rev 3.3, J4 — the classifier's cumulative-absolute yaw-change channel; registered in the interactions matrix)."
  event_types:
    - name: LOS gain
      fields: [source, distance, guard, timestamp, publisher]  # publisher = sensing-fact (Perception)
    - name: LOS break
      fields: [source, distance, guard, timestamp, R, break_type, causal_class, guard_yaw_delta, a_pre_break, threshold_applied, spot_position, hide_spot_id, entry_id, publisher]  # R = numeric R at break (rev 3.2); break_type: hide | wall | segment; causal_class (rev 3.1 ADJ-2 + rev 3.2 ruling + rev 3.3 J4): peek-out | guard-sweep | hide-dive | wall/segment | segment — the R7/R11 cancel counter consumes peek-out and player-attributed wall/segment; guard-sweep/hide-dive/segment never increment it (rev 3.2); guard_yaw_delta = cumulative-ABSOLUTE head yaw change during the window (J4 classifier channel, net rotation rejected); a_pre_break + threshold_applied = CR-FSM-01 amendment (rev 3.6): present on HIDE-DIVE breaks only — a_pre_break is the numeric accumulated alert at the last pre-break sight tick, threshold_applied is T_hide_entry(R) evaluated at that same tick; spot_position + hide_spot_id + entry_id = CR-FSM-01b extension (rev 3.7): also HIDE-DIVE breaks only — the entered spot's authored world position + ID and the Perception-allocated episode id at the direct hide-entrance open (the FSM's fallback/Chase targets and entry_id relay consume these — FSM C1.3/C1.5); NO-ALLOC-WHEN-LIVE (rev 3.8): the hide-entrance allocation fires only when the guard signals no live episode via the published live-Investigate/GuardGoalMode facts — otherwise the break fact relays the live episode's existing entry_id (retarget-under-suppression path, FSM C1.3); the FSM's hide-entry tier gate compares a_pre_break vs threshold_applied (Chase if a_pre_break >= threshold_applied, Investigate-commit cause=hide-entry fallback otherwise)
    - name: Noise heard
      fields: [kind, source, guard, fact_id, entry_id, consumption, timestamp, publisher]  # Perception relay of the NoiseEmitter — never a decision (rev 2026-08-28, B2: emitter-allocated ulong fact_id = transport/dedup token, one per published fact shared by ALL hearing guards; fact_id wraps only at 2^64 - 1 and is session-scoped; entry_id stays Perception-allocated at first-noise-heard of an episode [rev 3.3, J3], relayed never derived); BROADCAST to every in-range guard — one guard's consumption never invalidates another's relay (per-guard single-consumption, rev 3.3 — closes the R5/R12 single-consumer ambiguity); stale relays after Chase-end are dropped by the FSM, never re-heard
    - name: peer-recruit
      fields: [entry_id, fact_id, source_guard, area_position, timestamp, target_guard, publisher]  # FSM corroboration decision: second same-area noise within t_noise_corroborate_window; target_guard may be none when no eligible peer exists; publisher = FSM-decision
    - name: locked-zone
      fields: [entry_id, fact_id, source_guard, area_position, timestamp, patrol_area_id, publisher]  # FSM corroboration decision: third same-area noise within the window; zone-wide suspect response, no duplicate investigate-commit; publisher = FSM-decision
    - name: Threshold crossing (confirm-window start)
      fields: [entry_id, R, threshold_state, timestamp, publisher]  # numeric R added in v2; publisher = sensing-fact
    - name: Confirm-window elapsed
      fields: [entry_id, R, threshold_state, timestamp, publisher]  # rev 3.2: window reached t_win with LOS — the sensing fact that IS the threshold-path commit trigger; publisher = sensing-fact
    - name: Escalation (investigate-commit, every path)
      fields: [entry_id, R, cause, position, threshold_state, timestamp, hide_entry, publisher]  # rev 3.2: mandatory on every episode-OPENING path (rev 3.3, J1; tier-scoped rev 3.4 — the FSM publishes exactly one escalation decision per escalation tier, never a same-tier duplicate; an episode that commits Investigate and later reaches Chase additionally publishes its Chase-entry, both records in order); cause: threshold | noise | alert | cap-forced | hide-entry; R at commit read from a Perception-published R-bearing sensing fact at or just before commit (threshold paths: confirm-window-elapsed / chase-reached R; noise/alert paths: Perception's current-R readout piggybacked on the episode's sensing-fact preamble — rev 3.3 J3, no synchronous FSM->Perception query); entry_id relayed, never allocated; publisher = FSM-decision
    - name: Cap-reached
      fields: [entry_id, counter, position, timestamp, publisher]  # rev 3.2: cancel counter hit n_cancel_cap — a sensing fact, never an escalation; the FSM commits cause=cap-forced on this fact; publisher = sensing-fact
    - name: Reachability
      fields: [entry_id, guard, position, reachable, path_arrival_m, delta_y_m, timestamp, publisher]  # rev 3.3 (J2): Perception's un-gated per-tick reachable|unreachable verdict — ONE verdict set feeding the F2 Chase-cap, the R15 give-up predicate, and (via the FSM) the catch-gate geometry; |delta_y| beyond delta_y_tolerance -> unreachable; publisher = sensing-fact; consumed by Guard AI FSM
    - name: Chase-reached
      fields: [entry_id, R, threshold_state, position, timestamp, publisher]  # Perception's own accumulator fact (A >= T_chase with LOS) — publisher = sensing-fact; never an escalation (the FSM decides)
    - name: Chase-entry
      fields: [entry_id, cause, threshold_state, position, timestamp, paired_chase_reached, publisher]  # rev 3.3 (J1): the FSM's Chase-escalation DECISION record — Euclid grades THIS as the Chase escalation; the meter's Chase row triggers on it (A/R freeze on ALL Chase paths incl. hide-entry + carve-out); cause: threshold | hide-entry; paired to its chase-reached sensing precursor; publisher = FSM-decision
    - name: Chase-end
      fields: [entry_id, guard, timestamp, publisher]  # FSM publishes (R12); resumes R decay; Chase-tier Captures imply Chase-end (rev 3.2, scoped rev 3.9 CR-PERCEPTION-01) — witnessed Investigate-tier interior-inspection Captures publish Capture ALONE and exit the meter to Idle without a paired Chase-end
    - name: Investigate-resolution
      fields: [entry_id, cause, position, timestamp, publisher]  # cause: fruitless | sight-committed | cap-forced | capture | redirected | abandoned (rev 3.2); fruitless -> F6 residual share (FSM publishes, Perception consumes)
    - name: Capture
      fields: [entry_id, position, victim, carve_out, timestamp, publisher]  # carve_out: any spot-verification capture (Chase-tier spot-front capture OR witnessed either-tier interior-inspection capture) consumes ONE Chase-COUNT escalation slot per spot-verification incident (concept line 120, amended CR-CONCEPT-01 completion rev 3.9; incident delimiter = episode-scoped, CR-CONCEPT-02 rev 3.10 — closes when its episode(s) resolve, later witnessed dive = new incident + own slot); a carve_out Capture at the Investigate tier publishes Capture ALONE — no Chase-entry/Chase-end (rev 3.9 CR-PERCEPTION-01); Grade-GDD TODO: consumption of the witnessed-entry counting rule lands with the Suspicion Meter / Grade GDD
    - name: Movement-state transition
      fields: [from_state, to_state, timestamp, publisher]  # Player Controller event; at most one per tick after snapshot rebuild; same-frame inputs carry only the net pair; publisher = Player Controller
    - name: step_event
      fields: [state, position, stride_length_m, ledger_remainder_m, timestamp, publisher]  # Player Controller event; at most one per tick, actual XZ displacement only, remainder retained; consumed by Player Noise and audio; publisher = Player Controller
    - name: HideSpot occupied
      fields: [hide_spot_id, interior_position, timestamp, publisher]  # player-movement-hide #5 (rev 2026-08-26): posts on capsule entry to an Empty spot, exactly one per continuous occupancy (no duplicate/re-fire); consumed by Perception R4 (LOS-invisibility) + FSM hide-dive detection (CR-FSM-01b); publisher = HideSpot
    - name: HideSpot empty
      fields: [hide_spot_id, interior_position, timestamp, publisher]  # player-movement-hide #5 (rev 2026-08-26): posts synchronously on capsule exit, BEFORE any FSM tick consumes the current-tick fact set (D3 — the relocation-window escape / no-false-capture ordering); the ONLY writer of spot state Empty (player-occupancy-authoritative); publisher = HideSpot
    - name: Trace markers (behavioral, non-decision)
      fields: [marker_name, entry_id, timestamp, publisher]  # trace-only FSM behavioral markers — NOT decisions: never touch tier-scoped suppression or grading; Telemetry-visible only (rev 3.9 CR-PERCEPTION-01 registration). Known markers: postchase-sweep (rev 3.5, post-Chase LKP sweep beat); suppressed-hide-fallback (rev 3.9 C1.0 — emitted when ranks 1-3 win over the rank-4 sub-threshold hide-entry fallback, making the bounded supersession cell triageable in playtest)