# Whisper Ward — Entity Registry
# Cross-system entities and constants. Values are LOCKED herein; downstream GDDs
# must CONSUME these, never re-declare. Co-owned fields list all owning GDDs.
# Created: 2026-08-18 (Perception GDD — Phase 5b). Registry conflicts surface
# immediately per .claude/docs/coding-standards.md.

formula_definitions:
  - name: accumulator_charge_rate
    expression: "dA/dt = min(k/d, rate_max)"
    source: design/gdd/perception.md  # F1
    output_range: "[0, rate_max] A/s"
    variables: [k, d, rate_max, T_sample]
    note: "d is DUAL-MODE (rev 3.1, ADJ-1): path distance in the catch band (Euclidean <= catch_range + 2 m); Euclidean distance in the delta-band (catch_range + 2 m < Euclidean <= R_vis) with R3 navmesh-sample reachability — no path query runs in the delta-band (F1/R1 closure). d metric pin (rev 3.3, J2): guard-feet -> sampled-player-feet CENTER-TO-CENTER path length; the player is NOT a carved NavMeshObstacle (blocked-destination corners at the capsule edge would shrink d by up to r_player against delta_reach 0.02); pinned in the Technical-Setup sensing ADR"

  - name: entry_threshold
    expression: "T_entry(R) = max(T_base - k_res*R, T_floor)"
    source: design/gdd/perception.md  # F5
    output_range: "[0.04, 0.40] full-knob domain (T_floor min 0.2×0.20 = 0.04 .. T_base max 0.40 at R=0); starter slice [0.06, 0.30]"
    variables: [T_base, k_res, R, T_floor]
    note: "rev 3.6 (CR-FSM-01): Guard AI FSM consumes this formula as its hide-entry tier gate — alias T_hide_entry (renamed to avoid symbol collision with the FSM's former unsourced T_entry); the FSM evaluates T_hide_entry(R) = T_entry(R) at the last pre-break sight tick and compares the LOS-break fact's a_pre_break against threshold_applied (both fields on the hide-dive break event). Domain corrected rev 3.7 (review #4 S4): the derived FULL-KNOB domain is [0.04, 0.40]; [0.06–0.30] is the starter-config slice only — band-checking consumers must use [0.04, 0.40] or they reject/clamp legal configs."
    consumed_by: [Perception GDD, Suspicion/Grade GDD, Guard AI FSM GDD]

  - name: residual_decay
    expression: "R(t) = R(t0) * exp(-(t-t0)/tau_res)"
    source: design/gdd/perception.md  # F4
    output_range: "[0, R_max]"
    variables: [R, tau_res]

  - name: cadence_ratio
    expression: "cadence_ratio = cadence_walk / cadence_run; cadence_walk = V_walk / stride_length_walk; cadence_run = V_run / stride_length_run"
    source: design/gdd/player-noise.md  # F3 cadence monotonicity
    output_range: "(0, 0.85] for an accepted config; unbounded above before validation"
    variables: [cadence_ratio, cadence_walk, cadence_run, V_walk, V_run, stride_length_walk, stride_length_run]
    note: "The accepted starter value is approximately 0.79: (3.6 / 1.9) / (6.25 / 2.6). The load gate is exactly 0 < cadence_ratio <= 0.85; values above 0.85 are rejected with CFG_CADENCE_MARGIN_TOO_SMALL (and values above 1 also violate monotonicity). The registry direction is explicitly Walk divided by Run."

  - name: burst_root_product
    expression: "t_minus * t_plus = -2 * DeltaY_root / g"
    source: design/gdd/player-noise.md  # F4 root-product proof
    output_range: "finite for valid finite inputs; negative when DeltaY_root > 0, zero when DeltaY_root = 0, positive when DeltaY_root < 0"
    variables: [t_minus, t_plus, DeltaY_root, g]
    note: "DeltaY_root is the launch-to-landing root datum and is distinct from hearing falloff DeltaY. This diagnostic proof never replaces the strictly-positive-root predicate or the minimum-strictly-positive selection rule."

  - name: giveup_timeout
    expression: "t_giveup = t_giveup_base * s_diff * (1 + k_thorough * R/R_max)"
    source: design/gdd/perception.md  # F8
    output_range: "[2.45, 16.0] s (full knob domain); starter band [4.0, 6.0] s (base 4.0 × s_diff 1.0 × (1 + k_thorough·R/R_max), R ∈ [0, R_max])"
    variables: [t_giveup_base, s_diff, k_thorough, R, R_max]

  - name: reanchor_giveup_timeout
    expression: "t_reanchor_floor = t_giveup_base * s_diff * (1 + k_thorough * (R_reanchor / R_max)) + t_noise_reanchor_extend; t_reanchor = min(t_investigate_max, max(t_remaining, t_reanchor_floor))"
    source: design/gdd/player-noise.md  # Pass A AI behavior contract (2026-08-29); rewritten to the difficulty-scalar form rev 2026-08-31; monotonic budget rev 2026-09-20
    output_range: "[3.45, 15.0] s across the full registered domain (bounded by t_investigate_max ceiling); starter tuning slice approximately [6.0, 8.0] s"
    variables: [t_reanchor, t_reanchor_floor, t_remaining, t_investigate_max, t_giveup_base, s_diff, k_thorough, R_reanchor, R_max, t_noise_reanchor_extend]
    note: "Rev 2026-08-31: S_DIFF struck. Rev 2026-09-20 (clean full re-review): monotonic budget formula bound per AC15b-MVP: t_reanchor = min(t_investigate_max, max(t_remaining, t_reanchor_floor)) where t_reanchor_floor is the generic giveup_timeout D1 form computed at R_reanchor plus the fixed extension t_noise_reanchor_extend. Corroboration deepens search without truncating active remaining search time, capped by the room ceiling t_investigate_max. s_diff is the registered difficulty scalar (safe_range [0.7, 1.6]). R_reanchor is the Perception relay residual_at_hearing captured for the qualifying MVP re-anchor; the selected clock starts only after target/path-end reach. AC15b-MVP binds this monotonic floor and saturation cap."

  - name: reanchor_speed_ratio
    status: STRUCK 2026-08-31
    note: "DELETED by the 2026-08-31 clean full re-review: the S_DIFF speed-ratio was unmeasurable without sampling-instant ambiguity, produced a discontinuous r_actual = 0 cliff, and its max() floor leg was dead at every reachable configuration. The MVP re-anchor budget is reanchor_giveup_timeout (difficulty-scalar s_diff form + fixed extension). Any document or implementation still referencing S_DIFF / reanchor_speed_ratio is stale and fails consistency check."

  - name: catch_range_invariant
    expression: "catch_range > V_run*T_sample_max + hyst + r_guard + r_player + stopping_distance"
    source: design/gdd/perception.md  # F10
    output_range: "max-of-band 5.05 m < 5.5 m; catch_range floor 5.2 m"
    variables: [catch_range, V_run, T_sample_max, hyst, r_guard, r_player, stopping_distance]
    note: "rev 3.3 (J8): r_guard/r_player are LOCKED constants (0.40/0.35, no safe range — the F10 formula-table operand bands [0.35,0.45]/[0.30,0.40] were stale knob-form and were struck rev 3.3); max-of-band = 7.2*0.5 + 0.7 + 0.40 + 0.35 = 5.05 m. The 5.2 floor is conservative: true margin over max-of-band at the floor is 0.15 m. Every config-time AC reads these constants, never formula-table operand bands."

  - name: chase_speed_ratio
    expression: "V_chase >= 1.10 * V_run(runtime max); starter V_chase = rho_chase * V_run"
    source: design/gdd/perception.md  # F11 (rev 3.2 — V_run overload: runtime-max, starboard V_chase floor 7.92 at band max 7.2)
    output_range: "V_chase >= 7.92 m/s at V_run band max 7.2; starter 6.25 * 1.20 = 7.50 m/s"
    variables: [V_chase, V_run, rho_chase]
    note: "rev 2026-08-26 (/consistency-check G3 reconciliation): starter V_chase 7.50 is PINNED ABSOLUTE per player-third-person-controller.md :321 — the product form above is the HISTORICAL DERIVATION + coordinated-retune rule only; V_chase does NOT auto-scale with V_run. Solo-tuning ceiling V_run <= 6.81 (= 7.50/1.10, see V_run note rev 2026-08-25); crossing it requires a coordinated V_chase retune re-passing this invariant. The '>= 7.92 at band max' line is the requirement AT that corner if ever reached via coordinated retune — not an automatic consequence."

  - name: hidespot_catch_reach_resolvable
    expression: "path(guard_hold -> proxy(interior_position)) <= catch_range OR (EuclidXZ(guard_hold, interior_position) <= catch_range AND |DeltaY(interior_position, floor_worst)| <= delta_y_tolerance AND Linecast_clear(guard_eye -> aperture_portal_target))"
    source: design/gdd/player-movement-hide.md  # D1 (rev 2026-09-20)
    output_range: "Boolean in {PASS, FAIL}"
    variables: [guard_hold, interior_position, catch_range, delta_y_tolerance, floor_worst, aperture_portal_target, eps_arrive, standoff_margin]
    note: "D1 reach-resolvability invariant for HideSpot certification (approved 2026-09-20): ensures the FSM's HideSpotFront catch-gate can engage against the spot interior without capture-immunity dead-bands. Parameterized standoff requires EuclidXZ(guard_hold, interior_position) <= catch_range - eps_arrive - standoff_margin (<= 5.10 m at starters, <= 4.80 m at minimum catch_range 5.20 m). Linecast targets aperture_portal_target with +0.05 m outward offset to avoid prop-mesh self-occlusion."
    consumed_by: [Guard AI FSM GDD, Level GDD, Hide System GDD]

  - name: hidespot_vertical_offset_authoring_margin
    expression: "|DeltaY(interior_position, floor_worst)| < delta_y_tolerance - auth_margin"
    source: design/gdd/player-movement-hide.md  # D2 (rev 2026-09-20)
    output_range: "Boolean in {PASS, FAIL}"
    variables: [interior_position, floor_worst, delta_y_tolerance, auth_margin]
    note: "D2 vertical authoring margin (approved 2026-09-20): ensures authored interior datum stays strictly within the delta_y_tolerance gate with a safety buffer auth_margin. Joint load constraint delta_y_tolerance - auth_margin >= 0.3 m is enforced at config load time (REJECT_CONFIG_AUTH_MARGIN_JOINT_VIOLATION)."
    consumed_by: [Level GDD, Hide System GDD]

  - name: through_spot_escape_time_invariant
    expression: "transit = path(guard_spawn, guard_hold) / max(V_relevant, 0.1); pathLen / V_crouch + t_margin_react <= transit + t_spotfront_verify_through"
    source: design/gdd/player-movement-hide.md  # D4 (rev 2026-09-20)
    output_range: "Boolean in {PASS, FAIL}"
    variables: [pathLen, V_crouch, t_margin_react, transit, guard_spawn, guard_hold, V_relevant, t_spotfront_verify_through]
    note: "D4 through-spot escape time invariant (AC10, approved 2026-09-20): guarantees that a crouching player diving through a dual-exit spot (vent/crawlway) has sufficient travel budget (pathLen <= 5.52 m at starters) to escape outside guard LOS before the witnessing guard arrives and completes spot-front verification."
    consumed_by: [Level GDD, Guard AI FSM GDD, Hide System GDD]

  - name: dominant_threat_selection_ratio
    expression: "r_threat,i = A_i / T_entry,i (if T_entry,i > 0 else 0.0); g* = null if max(A_i) == 0 else argmax(r_threat,i)"
    source: design/gdd/suspicion-meter-grade.md  # D1 (rev 2026-09-20)
    output_range: "[0.0, 25.0] (finite non-negative ratio; typically [0.0, 1.0] in Quiet, >= 1.0 in Investigate; null when max(A_i) == 0)"
    variables: [A_i, T_entry_i, r_threat_i, g_star]
    note: "Dominant Threat Selection Ratio (D1, rev 2026-09-20): Multi-guard threat arbitration for single-chevron HUD rendering and audio focus. If max(A_i) == 0, g* is null and chevron is hidden. Tie-breaking cascade: (1) max accumulator A_i, (2) min Euclidean distance EuclidXZ(guard, player), (3) lexicographical ordinal comparison of guard_eid."
    consumed_by: [Suspicion/Grade GDD, HUD/UI GDD, Audio GDD]

  - name: room_grade_quality_score
    expression: "S_room = 100.0 if (Status == Completed and M == 0) else max(10.0, 100.0 - min(grade_penalty_cap, P_incident,room + P_residual,room)); P_incident,room = min(grade_penalty_cap, sum(N_chase,i * W_chase)); P_residual,room = sum((w_i / W_total) * P_residual,i)"
    source: design/gdd/suspicion-meter-grade.md  # D4-D7 (rev 2026-09-20)
    output_range: "[0.0, 100.0] pts (completed escape floor 10.0 pts; terminal Capture 0.0 pts; M=0 sanctuary room 100.0 pts)"
    variables: [S_room, w_i, W_total, P_incident_room, P_residual_room, P_residual_i, W_chase, W_capture, W_residual, N_chase, N_capture, R_final, R_max, grade_penalty_cap, M, Status]
    note: "Global-incident room aggregate score (D4-D7, rev 2026-09-20): Chase penalties are pooled globally per room without multi-guard dilution. Exposure weighting w_i applies strictly to residual wariness snapshots. Clean Burst distractions incur 0 direct penalty (W_fruitless obsolete). Guaranteed 10.0 pt completion floor for non-capture runs. Rank S requires sum(N_chase) == 0."
    consumed_by: [Suspicion/Grade GDD, Telemetry GDD, HUD/UI GDD]

  - name: cumulative_path_length
    expression: "d_path = sum_{k=0}^{N-2} ||p_{k+1} - p_k||_2 if (status != PathInvalid and N >= 2) else infinity"
    source: design/gdd/navmesh-pathfinding.md  # D1 (rev 2026-09-20)
    output_range: "[0.0, +infinity) m"
    variables: [status, N, p_k, d_path]
    note: "Cumulative Path Length (D1, rev 2026-09-20): Continuous 3D piecewise-linear path distance along NavMeshPath.corners polyline. Evaluates to infinity on PathInvalid or N < 2. Serves as the authoritative distance metric for F10 catch-gate proximity."
    consumed_by: [NavMesh GDD, Guard AI FSM GDD, Perception GDD]

  - name: catch_gate_state
    expression: "S_catch(t) = ACTIVE if (status == PathComplete and d_path <= catch_range) else (INACTIVE if (status != PathComplete or d_path > catch_range + hyst) else S_catch(t - Delta_t))"
    source: design/gdd/navmesh-pathfinding.md  # D2 (rev 2026-09-20)
    output_range: "Enum in {ACTIVE, INACTIVE}"
    variables: [status, d_path, catch_range, hyst, S_catch]
    note: "Chase Catch-Gate Path Distance & Hysteresis State (D2, rev 2026-09-20): Dual-boundary Schmidt trigger for catch-meter accrual. Requires PathComplete and d_path <= catch_range to activate; pauses accrual when d_path > catch_range + hyst or path becomes partial/invalid."
    consumed_by: [NavMesh GDD, Guard AI FSM GDD, Perception GDD]

  - name: arrival_precedence
    expression: "State_arrive = Arrived if (EuclidXZ(p_guard, p_target) <= eps_arrive) else (PathEnd if (status == PathPartial and EuclidXZ(p_guard, p_corner_last) <= eps_arrive) else Traversing)"
    source: design/gdd/navmesh-pathfinding.md  # D3 (rev 2026-09-20)
    output_range: "Enum in {Arrived, PathEnd, Traversing}"
    variables: [p_guard, p_target, p_corner_last, eps_arrive, status, State_arrive]
    note: "Arrival Predicate & Precedence Function (D3, rev 2026-09-20): Classifies destination arrival into mutually exclusive states. Arrived takes strict precedence over PathEnd if both conditions coincide (FSM rev 3.8 lock)."
    consumed_by: [NavMesh GDD, Guard AI FSM GDD]

  - name: chase_repath_trigger
    expression: "Trigger_repath = (t_since_last_path >= t_repath_min) and ((t_since_last_path >= T_repath) or (EuclidXZ(p_player, p_player_last_path) >= Delta_p_trigger))"
    source: design/gdd/navmesh-pathfinding.md  # D4 (rev 2026-09-20)
    output_range: "Boolean in {TRUE, FALSE}"
    variables: [t_since_last_path, t_repath_min, T_repath, p_player, p_player_last_path, Delta_p_trigger, Trigger_repath]
    note: "Chase Re-Pathing Dual-Trigger Predicate (D4, rev 2026-09-20): Throttles CalculatePath queries to protect 16.6 ms frame budget. Evaluates periodic sensing tick and player Euclidean planar displacement, with rate floor clamp t_repath_min (0.10 s, 10 Hz ceiling)."
    consumed_by: [NavMesh GDD, Guard AI FSM GDD]

  - name: navmesh_bake_voxel_invariant
    expression: "v_size <= r_guard / 3"
    source: design/gdd/navmesh-pathfinding.md  # D5 (rev 2026-09-20)
    output_range: "Boolean in {PASS, FAIL}; v_size <= 0.1333 m at starter r_guard 0.40 m"
    variables: [v_size, r_guard]
    note: "NavMesh Bake Voxel Resolution Invariant (D5, rev 2026-09-20): Compilation ceiling ensuring agent capsule geometry clears all authored passageways without topological disconnections."
    consumed_by: [NavMesh GDD, Level GDD]

  - name: corridor_width_invariant
    expression: "W_corridor >= 2 * r_guard + margin_corridor"
    source: design/gdd/navmesh-pathfinding.md  # D6 (rev 2026-09-20)
    output_range: "Boolean in {PASS, FAIL}; W_corridor >= 1.20 m at starters"
    variables: [W_corridor, r_guard, margin_corridor]
    note: "Corridor Width Clearance Invariant (D6, rev 2026-09-20): Level certification constraint guaranteeing unjammed two-way passing and clean RVO avoidance (floor 1.20 m at r_guard 0.40 m, margin 0.40 m)."
    consumed_by: [NavMesh GDD, Level GDD]

  - name: contact_surface_pushout
    expression: "p_contact = p_hit + n_hit * (r_proj + eps_contact)"
    source: design/gdd/physics-collision-config.md  # D1 (rev 2026-09-20)
    output_range: "Vector3 (m)"
    variables: [p_contact, p_hit, n_hit, r_proj, eps_contact]
    note: "Contact Surface Push-Out Formula (D1, rev 2026-09-20): Offsets projectile center along contact surface normal by (r_proj + eps_contact) with eps_contact = 0.001 m to prevent collider geometry re-penetration on subsequent ticks."
    consumed_by: [Physics GDD, Player Noise GDD, Level GDD]

  - name: kinematic_step_trajectory
    expression: "p(t + Delta_t) = p(t) + v(t) * Delta_t + 0.5 * g * Delta_t^2; v(t + Delta_t) = v(t) + g * Delta_t"
    source: design/gdd/physics-collision-config.md  # D2 (rev 2026-09-20)
    output_range: "p in Vector3 (m), v in Vector3 (m/s)"
    variables: [p, v, g, Delta_t, t]
    note: "Kinematic Trajectory Step Integration (D2, rev 2026-09-20): Deterministic 120 Hz fixed-step integration for Burst projectile flight with continuous swept SphereCast (Delta_t = 1/120 s)."
    consumed_by: [Physics GDD, Player Noise GDD]

  - name: subtick_root_selection
    expression: "t_flight = min { t in t_roots | t > eps_t }"
    source: design/gdd/physics-collision-config.md  # D3 (rev 2026-09-20)
    output_range: "[eps_t, +infinity) s"
    variables: [t_flight, t_roots, eps_t]
    note: "Sub-Tick Analytical Root Selection (D3, rev 2026-09-20): Selects the smallest real positive ballistic root strictly exceeding eps_t = 1/120 s to eliminate float rounding zero-time detonations on flat ground."
    consumed_by: [Physics GDD, Player Noise GDD, Level GDD]

  - name: launch_initial_overlap_check
    expression: "Admission = ADMITTED if N_hits == 0 else (REJECTED_OVERLAP if (1 <= N_hits < 64) else FAIL_CLOSED_SATURATED)"
    source: design/gdd/physics-collision-config.md  # D4 (rev 2026-09-20)
    output_range: "Enum in {ADMITTED, REJECTED_OVERLAP, FAIL_CLOSED_SATURATED}"
    variables: [N_hits, Admission]
    note: "Launch Initial Overlap Pre-Spend Check (D4, rev 2026-09-20): OverlapSphere preflight check using static 64-element buffer. Rejects embedded launch without spend; fails closed on saturation."
    consumed_by: [Physics GDD, Player Noise GDD, LevelFixture]

  - name: collision_ambiguity_invariant
    expression: "TieStatus = AMBIGUOUS_COLLISION if |d2 - d1| < delta_ambiguity else DETERMINISTIC"
    source: design/gdd/physics-collision-config.md  # D5 (rev 2026-09-20)
    output_range: "Enum in {AMBIGUOUS_COLLISION, DETERMINISTIC}"
    variables: [d1, d2, delta_ambiguity, TieStatus]
    note: "Collision Ambiguity Invariant (D5, rev 2026-09-20): Level certification constraint rejecting tie hits within delta_ambiguity = 0.001 m to preserve deterministic preview/runtime parity."
    consumed_by: [Physics GDD, Player Noise GDD, Level GDD]

  - name: min_wall_thickness_invariant
    expression: "T_wall >= delta_wall_min = 2 * r_proj = 0.10 m"
    source: design/gdd/physics-collision-config.md  # D6 (rev 2026-09-20)
    output_range: "Boolean in {PASS, FAIL}; T_wall >= 0.10 m"
    variables: [T_wall, delta_wall_min, r_proj]
    note: "Minimum Wall Thickness Invariant (D6, rev 2026-09-20): Level geometry certification constraint ensuring all solid E20 obstacles have thickness >= 0.10 m to prevent projectile tunneling and acoustic leakage."
    consumed_by: [Physics GDD, Level GDD, Perception GDD]

constants:
  - name: min_wall_thickness
    value: 0.10  # m — minimum solid wall thickness invariant (D6)
    safe_range: "[0.08, 0.25] m"
    note: "Minimum physical thickness for E20 obstacles to prevent projectile tunneling and raycast leakage."
    source: design/gdd/physics-collision-config.md  # D6
    consumed_by: [Physics GDD, Level GDD, Perception GDD]

  - name: sensing_sync_max_frequency
    value: 5.0  # Hz — maximum frequency for Physics.SyncTransforms before AI sensing ticks
    safe_range: "[2.0, 10.0] Hz"
    note: "Rate cap for explicit transform synchronization to protect 16.6 ms frame budget."
    source: design/gdd/physics-collision-config.md  # Tuning Knobs
    consumed_by: [Physics GDD, Perception GDD, Guard AI FSM GDD]

  - name: T_base
    value: 0.30
    safe_range: "[0.20, 0.40]"
    source: design/gdd/perception.md  # F5; prototype-validated
    consumed_by: [Perception GDD, Suspicion/Grade GDD]

  - name: T_chase
    value: 1.00
    safe_range: "[0.85, 1.00]"  # ≡ A_max — meter scale caps the threshold; > 1.00 is unreachable by the accumulator
    alias_of: A_max
    source: design/gdd/perception.md  # F1/F2/F9; prototype-validated
    consumed_by: [Perception GDD, Guard AI FSM GDD, Suspicion/Grade GDD]

  - name: T_floor
    value: 0.06  # starter value at T_base 0.30 — the LOCK is the relation, not a literal
    locked: true  # C-6 pin: floor is NOT a knob
    relation: "T_floor = 0.2 * T_base (derived; value moves with T_base — [0.04, 0.08] across the T_base domain)"
    derived: true
    source: design/gdd/perception.md  # F5
    consumed_by: [Perception GDD, Suspicion/Grade GDD]

  - name: forgiveness_floor
    value: 0.030  # recommended starter; owned by Suspicion/Grade GDD
    safe_range: "DERIVED band [0.05*T_base, 0.2*T_base) — starter [0.015, 0.06), rec 0.030"  # upper edge = T_floor equality forbidden; band tracks the derived T_floor
    constraint: "0 <= forgiveness_floor < T_floor (T_floor = 0.2*T_base, dynamic [0.04, 0.08]); margin (T_floor - ff) in (0, 0.15*T_base]"
    source: design/gdd/perception.md  # F15 (revision 3 — floor is derived, not literal)
    owned_by: "Suspicion/Grade GDD (co-sign)"
    consumed_by: [Perception GDD, Suspicion/Grade GDD]

  - name: k
    value: 1.50
    safe_range: "[1.0, 2.0]"
    source: design/gdd/perception.md  # F1
    consumed_by: [Perception GDD]

  - name: rate_max
    value: 0.60
    safe_range: "[0.40, 0.80]"
    source: design/gdd/perception.md  # F1
    consumed_by: [Perception GDD]

  - name: r_res
    value: 0.10
    safe_range: "[0.05, 0.15]"
    source: design/gdd/perception.md  # F3
    consumed_by: [Perception GDD]

  - name: tau_res
    value: 16  # s
    safe_range: "[12, 20] s"
    source: design/gdd/perception.md  # F4
    consumed_by: [Perception GDD]

  - name: k_res
    value: 0.24
    safe_range: "[0.15, 0.30]"
    source: design/gdd/perception.md  # F5
    consumed_by: [Perception GDD, Suspicion/Grade GDD]

  - name: R_max
    value: 1.00
    safe_range: "[0.5, 1.0]"
    source: design/gdd/perception.md  # F3/F9
    consumed_by: [Perception GDD, Suspicion/Grade GDD, Guard AI FSM GDD]  # FSM D1 t_giveup(R) + t_hide_entry(R) derivation consume R_max (rev 3.6 lock-step)

  - name: t_win
    value: 1.2  # s
    safe_range: "[1.0, 2.0] s"
    constraint: "t_win >= 2 * T_sample_max (locked floor 1.0 s); t_win < t_giveup"
    source: design/gdd/perception.md  # F7
    consumed_by: [Perception GDD]

  - name: t_giveup_base
