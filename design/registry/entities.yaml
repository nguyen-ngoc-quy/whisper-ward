    safe_range: "[1.4, 1.8] m"
    note: "Perception F12 hearing OCCLUSION ray endpoint (no ear bone) — rev 2026-08-31 (clean full re-review, user-selected): the eye is the geometric ray endpoint ONLY; the R_eff falloff datum is the GUARD'S FEET (ΔY = |noise_origin_y − guard_feet_y|), never the eye. The prior eye-anchored falloff multiplied every flat-ground movement pip by 1 − 1.6/4.0 = 0.60, silently shrinking nominal 4.0/6.0/10.5 m radii to ≈2.65/3.98/6.43 m effective and breaking the LOCKED walk:Burst ratio. noise_origin_y is feet_y + f12_noise_origin_offset for movement and the published landing_contact_y for Burst. Registered so Level authors compute effective radius deterministically (see hearing_y_hard_cutoff note for the effective-radii table)."
