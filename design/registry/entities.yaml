  lifecycle_transition_table:  # authoritative source for attempt_epoch behavior; reproduced verbatim in player-noise.md §Ownership and referenced by perception.md, guard-ai-fsm.md, and player-movement-hide.md
    owner: design/registry/entities.yaml
    canonical_reproducers: [design/gdd/player-noise.md, design/gdd/perception.md, design/gdd/guard-ai-fsm.md, design/gdd/player-movement-hide.md]
    full_room_restart_semantics: "Full-room restart clears the carried Burst slot AND restores all authored pickups to Placed. Death/segment-reset preserves the carried slot; a Placed instance that was the source of a carried Burst is not restored while the slot is occupied."
    rows:
      - event: "Death → capture (or vice versa)"
        attempt_epoch: "One atomic transition; exactly one increment"
      - event: "Player respawn (post-death)"
        attempt_epoch: "Part of the same atomic transition; no additional increment"
      - event: "Segment reset (room transition)"
        attempt_epoch: "One atomic transition; exactly one increment"
      - event: "Full-room restart"
        attempt_epoch: "New session; globally fresh, never-reused session_id, fresh attempt_epoch = 1"
      - event: "Scene reload"
        attempt_epoch: "New session; fresh attempt_epoch = 1"
      - event: "New playable attempt"
        attempt_epoch: "New session; fresh attempt_epoch = 1"
      - event: "Pause / resume"
        attempt_epoch: "No increment; virtual clock freezes and resumes"
      - event: "Pool / unpool"
        attempt_epoch: "No increment; scheduler phase preserved"
  conditional_field_rules:
    route_evidence.required_failed_cases: "Required on every route record; use [] when failed_gate_spend is false and enumerate failed case IDs when it is true."
    pickup_interactions.telemetry_only: "Must be true for pickup-reached; pickup-reached is telemetry only and cannot mutate pickup state, spend a Burst, or publish NoisePublished."
    pickup_state_transitions.placed_to_carried: "The accepted Interact record must prove reachable=true and the typed transition Placed → Carried with expected_spend_committed=false and expected_noise_published=false."
    route_causality.target_and_route_fields: "Exactly one canonical MVP causal chain is permitted for the gate route; it must use expected_gate_entry_transition=blocked_to_open. The resulting open state and reachable exit are represented by the linked route evidence, not a second causality transition record. Target-marker semantics are logical-objective semantics, while route_evidence_id and gate_exit_reach_route_id identify the physical route evidence."
    route_evidence.closed_gate_geometry: "The pre-open gate route must reference a World, non-trigger closed-state collider with stable ID world_gate_closed_01 and report PathPartial/path_complete=false; the post-open route omits that obstruction and reports PathComplete. Full restart restores the collider's logical blocked state."
    geometry_variants.synthetic_fallback: "Only geometry_throw_void_open_01 may declare aabb_policy=diagnostic_fallback_exempt; its timeout fallback is diagnostic-only and cannot certify a playable endpoint. All other geometry variants use the declared room AABB."
    navmesh_layer_separation_check: "LevelFixture-owned required record; enumerate every NavMesh collider and fail closed when its layer intersects the E20 World mask. actual remains UNCAPTURED until runtime/scene capture and cannot satisfy certification. Route records also require navmesh_area_mapping_id=navmesh_area_mapping_mvp, which resolves Walkable to area index 0 and mask bit 1 before path validation."
    route_evidence.navmesh_area_mapping: "Every route record serializes navmesh_area_names, navmesh_area_mask, and navmesh_area_mapping_id. Resolve each named area through the registered mapping and require the OR of resolved bits to equal the serialized mask; unknown names or mismatches fail INVALID_ROUTE. This NavMesh mapping is separate from the E20 Physics layer mask."
    guard_extended_search_patrol.clearance: "Every non-death failed-spend search record resolves search_volume_geometry_id, reserve_route_id, guard_agent_radius_m, clearance_predicate, and fixed virtual-tick sampling. reserve_route_clear_during_search is valid only when the continuous swept player disc has no intersection with the search volume expanded by the registered guard radius throughout the declared re-anchor window; a boolean without these bindings is invalid."
    audio_cue_id.lifecycle: "Audio/UI allocates audio_cue_id at request creation from (session_id, attempt_epoch, cue_kind, local_sequence); retry, duplicate, callback, cancellation, stale rejection, and unsupported integration reuse the id and never allocate a replacement. The id is presentation evidence only and never replaces fact_id, source_event_id, or entry_id."
    performance_budget.evidence_union: "Every millisecond budget is {status: PENDING_OQ6, value_ms: null} or {status: CAPTURED, value_ms: finite}; PENDING_OQ6 is non-passing, diagnostic_only profiles require required_budget_ms=null, and PC has no millisecond gate until a hardware profile is registered."
    gate_transitions.owner_and_causality: "The Level owner alone mutates gate state. A valid blocked → open transition must match the same captured investigate decision's session, epoch, fact_id, entry_id, and causal order."
    gate_transitions.kind_binding: "Required on every gate-open record (rev 2026-08-31): trigger_noise_kind ∈ {movement, burst} is the self-identifying trigger stream and binds the transition to the causing noise kind (burst for the MVP fixture — a movement pip can never open the gate); the responsible serialized source id is landing_fact_id for Burst and step:<step_id> for Movement, while bare step_id/flight_handle_id remain internal producer fields, and landing_fact_id must resolve to the same causal chain's captured published landing fact. A gate-open record without both bindings, a null landing_fact_id, a Movement step_id where a Burst landing is required, or a landing_fact_id that is not the chain's landing contact, fails closed (MISSING_REQUIRED_FIELD or INVALID_GATE_TRANSITION)."
    gate_transitions.receiver_phase_window_binding: "Required on every gate-open record (rev 2026-09-01, B9): receiver_phase_window_id must resolve to a patrol_phase_window declared by the level manifest, and receiver_phase_window[] must carry the captured patrol-phase interval(s) in which the certified landing is hearable at the recorded R_eff from the guard's declared patrol route. The level fixture binds patrol_pre_spend_01 (guard on a leg away from the gate pickup corridor, loop_index ≥ 1, state Patrol, no re-anchor or give-up in flight). A gate-open record whose receiver_phase_window_id is null, unknown, non-resolving, or whose interval list is missing fails INVALID_GATE_TRANSITION; the gate chain must be satisfiable inside the declared window (no unstated patrol-phase dependence)."
    solids.fixture_role: "Optional fixture-purpose metadata; when present it is one of launch_overlap_blocker, gate_closed_obstruction, or collision_probe and never replaces the physical surface_role enum. Physical surface_role remains limited to landing_surface, ceiling, or occluder."
    route_evidence.geometry_binding: "Every route record must resolve geometry_binding_id to one geometry_variants.variant_id and route_safety_predicate_id to one route_safety_predicates record. geometry_overlay_ids explicitly compose stateful variants (for example, the closed gate) over the base room geometry; obstruction and pocket solids must resolve through the resulting canonical geometry manifest."
    route_safety_predicates.gate_crossing: "A post-Burst exit predicate may declare exactly one authorized crossing of the closed-gate overlay, bound to the captured gate transition and direction; after that interval the continuous swept-player predicate forbids re-entry. Predicates without an authorized crossing remain no-intersection predicates. Route boundary semantics are explicit: `exclusive` rejects contact with the expanded forbidden corridor, while `inclusive` is permitted only when the record declares a non-zero boundary tolerance."
    route_safety_predicates.non_reentry: "Every route safety record serializes the forbidden gate corridor, any extended-search zone IDs, player swept-disc radius, continuous-sweep sampling rule, and explicit no-intersection predicate. actual remains UNCAPTURED until runtime/scene capture."
    signal_a_observation_pockets.binding: "Every Signal-A visibility record resolves observation_pocket_id to a pocket whose cover solid, geometry variant, bounds, entry route, exit route, player clearance, and containment predicates are serialized. A clear Linecast alone cannot certify the pocket."
    receiver_probes.expected_blocker_id: "Required on every probe; use none when expected_linecast_clear is true and the registered blocker ID when it is false."
    receiver_probes.endpoint_authoring_mode: "Required on every probe; values are real_guard_endpoint or synthetic_endpoint. real_guard_endpoint requires endpoint_source_id to resolve to the authored guard marker and registered eye endpoint; synthetic_endpoint requires an explicitly authored test endpoint and cannot certify the playable MVP route."
    receiver_probes.boundary_semantics: "Required on every probe; use inclusive at the radius boundary, exclusive_cutoff at the zero-effective-radius cutoff, and not_applicable otherwise."
    receiver_probes.falloff_datum: "Required on every probe (rev 2026-08-31): guard_feet_ws is the explicit falloff datum and dy_m = |hearing_origin_ws.y − guard_feet_ws.y|; the guard eye endpoint is the occlusion-ray endpoint only and never anchors the falloff. R_eff = nominal_radius × (1 − dy_m / dy_max_m), exclusive at dy_m ≥ dy_max_m."
    receiver_probes.source_position_id: "Required on every playable-route receiver probe (rev 2026-08-31): the probe's source position must be DERIVED from the captured published landing position of the referenced throw volume (source_position_id = the throw volume's landing contact), never independently authored. Independently authored synthetic source positions are test-only and cannot certify the playable MVP route causality (route_causality.receiver_probe_id must resolve to a probe whose source_position_id references the same causality chain's landing)."
    route_causality.throw_snapshot_chain: "Required on every route causality record (rev 2026-09-09): throw_snapshot_id must resolve to the immutable ThrowSnapshot shared by runtime, preview, and fixture — including authoritative resolved_velocity; the snapshot is a causality PRECONDITION and is asserted field-for-field (parity: runtime snapshot == preview snapshot == fixture snapshot); source_timestamp is allocation/order metadata, terminal_publication_time is the captured Collision/Timeout publication time, and t_publish equals terminal_publication_time for a published Burst; fact_publication_state must be published and terminal_cause must be Collision or Timeout; landing_contact_probe_id and landing_surface_id bind the physical landing into the same chain; receiver_probe_id must resolve to a probe whose source is the captured landing contact of THIS chain's throw; fsm_relay_outcome must equal consumed for the gate-open chain."
    gate_transitions.gate_negative: "Required on every failed-spend-adjacent gate record (rev 2026-08-31): gate_state_after_failed_spend must be blocked and gate_exit_reachable_after_failed_spend must be false for every failed_gate_spends case; no void, timeout-fallback, off-NavMesh, unreachable, initial-overlap, or death-cancelled landing may appear in any gate_transitions causal chain — a guard Investigate alone never opens the gate. Violation maps to INVALID_GATE_TRANSITION or the new GATE_OPENED_BY_INVALID_LANDING code."
    failed_gate_spends.landing_gate_fields: "Required on every failed-spend record (rev 2026-08-31): landing_navmesh_status (on_navmesh | off_navmesh | void | not_applicable — not_applicable only for death-cancelled flights that never land, matching the landing_position: null contract), landing_guard_reachable (boolean), fallback_type (none | closest_standoff | void_last_simulated | not_applicable), gate_transition_eligibility (eligible | ineligible — ineligible for every failed/fallback landing), gate_state_after_failed_spend (blocked), gate_exit_reachable_after_failed_spend (false)."
    teaching_sequence.order_and_crouch_control: "Required section (rev 2026-09-09): ordered by the order field; the first Walk and Run teaching demonstrations MUST occur at lower order values than the first Burst-spend beat (the player learns movement noise before spending a Burst); every sequence includes a Crouch control case whose expected_crouch_control_no_fact is true (no step_event, no NoisePublished while crouched); expected_guard_observable_response must explicitly classify each beat as either an emission-only no-response outcome or a visible response outcome. Emission-only Crouch, Walk, and Run beats may use an explicit none_no_response value: Crouch proves no step event or raw noise fact, while Walk and Run may prove raw NoisePublished emission outside R_eff with no relay or FSM response. Hearing/response beats must name the visible orient/Investigate response observable from player_observation_position_ws; the certified MVP Burst-spend beat must use that visible response form."
    signal_a_visibility.required_fields: "Required section (rev 2026-08-31): every record asserts a guaranteed first-session causal observation — the vantage has clear LOS to the guard (vantage_to_guard_linecast_clear=true), the guard starts in a hearing-eligible state (Patrol; visibility_exclusions must list HideSpotFront, Chase, cooldown, and stale-epoch exclusion), the expected Burst landing position is the chain's captured landing (not a synthetic source), the orient-tell window is bounded by the FSM tick (expected_fsm_tick_bound_s), and the visible causal chain lands → NoiseHeardRelay → investigate-commit → visible guard movement is asserted end-to-end."
    restart_transaction.atomicity: "Required section (rev 2026-08-31): the restart is ONE all-or-nothing transaction per full_room_restart_transaction; ordered_steps enumerate the six ordered atomic steps; all_or_nothing=true; any partial application maps to RESTART_NOT_ATOMIC; expected_recovery_outcome asserts both pickups Placed, carried slot cleared, attempt_epoch=1, gate/exit at authored initial states, and residual state cleared."
    guard_extended_search_patrol.required_fields: "Required section (rev 2026-08-31): the authored investigation-zone bounds and patrol bounds for the failed-spend re-anchor window; expected_reanchor_extend_s is computed from the canonical reanchor_giveup_timeout formula with the level's resolved difficulty scalar s_diff (s_diff_resolved — the S_DIFF speed-ratio form is struck rev 2026-08-31); reserve_route_clear_during_search must be true for certification — a reserve route intersecting the guard's extended search is a certification failure."
    tolerance_class.required: "Required on every tolerance-bearing record (rev 2026-08-31): values are gameplay_contract (≤ 5×10⁻³ m — the CompareTolerance gate) or oracle_quantizer (≤ 1×10⁻³ m absolute — expected-vs-computed static-oracle records). The validator gates per class; an unlabeled tolerance-bearing record fails closed with INVALID_TOLERANCE."
    valid_throw_volumes.landing_surface: "Required on every positive throw; landing_surface_id must resolve to a World, non-trigger solid in the geometry variant, landing_surface_y_m must equal its authored contact surface, and landing_contact_mode must be surface_top_world_solid. An open-volume-only record fails closed."
    valid_throw_volumes.band_domain: "Required on every positive throw: band_reachable_theta_domain_deg is the union of closed θ intervals within 0° < θ ≤ 45° for which the authored F4 oracle returns R_actual ∈ [8, 12]. The authored theta_deg must belong to one interval and band_domain_result must be PASS; otherwise content load fails AUTHORED_THETA_OUTSIDE_BAND_DOMAIN."
    negative_validation_cases.band_domain: "Required on every band-domain negative case: preserve the computed band_reachable_theta_domain_deg and set band_domain_result=REJECT. A case may also have range_gate=REJECT; the validator reports AUTHORED_THETA_OUTSIDE_BAND_DOMAIN before launch when the authored θ is outside the recorded domain."
    solids.surface_fields: "surface_role is landing_surface, ceiling, or occluder. surface_top_y_m is numeric for landing_surface/ceiling and null for occluder; a landing surface must be a World non-trigger solid referenced by a positive throw volume."
    occlusion_probes.trigger_ignored: "Required on every probe and records the query policy, not the observed collider type: true exactly when the probe used QueryTriggerInteraction.Ignore (the universal E20 occlusion policy). Observed trigger geometry, when relevant to a negative leg, is recorded separately as observed_is_trigger; a clear or solid probe therefore still has trigger_ignored=true."
    negative_validation_cases: "All listed keys are required. Formula fields may use NOT_EVALUATED or null only when the expected rejection occurs before that calculation; no-launch identity fields are null by contract. A Level-owned authored-grazing case must identify grazing_surface_id, grazing_clearance_m, and geometry_validation_result=REJECT; non-grazing cases use grazing_surface_id=null, grazing_clearance_m=null, and geometry_validation_result=NOT_EVALUATED."
    gate_trigger_negative_cases: "All listed keys are required. The MVP gate-footstep negative must record trigger_noise_kind=movement, a non-null source_step_id, expected_gate_state=blocked, expected_gate_exit_reachable=false, and actual=UNCAPTURED until runtime capture; it cannot mutate the gate or satisfy the Burst-only causal chain."
    patrol_phase_windows: "Both declared window IDs must be unique and resolve from every patrol_phase_window and receiver_phase_window_id reference. Each record must keep guard_eid and guard_state explicit and provide a captured interval at least its declared min_validity_s; the movement-teaching window uses 1.5 s, while patrol_pre_spend_01 uses 2.24 s = certified lower-route flight upper bound 1.4330082768164518 s + T_hearing 0.2 s + T_fsm 0.3 s + 0.3 s scheduling margin. The pre-spend interval starts at the accepted Throw edge and remains valid through terminal publication, hearing admission, and FSM response. A shorter or unresolved window fails INVALID_ROUTE. actual remains UNCAPTURED until runtime capture."
    failed_gate_spends.landing_position: "Required on every record; use the captured published contact for collision, the captured last sphere center for timeout, and null only for death-cancelled flights that never land."
    failed_gate_spends.terminal_timing: "Required on every record; contact cases capture flight elapsed, SphereCast fraction, contact event time, timeout_boundary_s=3.0, and comparison_result=contact_before_or_at_timeout; timeout captures timeout_wins with null contact; death captures death_wins before any collision/timeout callback. terminal_cause identifies the resolution reason, burst_state_after identifies the resulting lifecycle state, and terminal_publication_time is the absolute virtual time of the winning fixed-tick boundary (start_tick + winning_tick_index) × dt_max for Collision/Timeout, or the death-cancellation time for DeathCancelled; winning_tick_index is the authoritative integer Collision/Timeout adjudicator per E-FX-10 and is REQUIRED_RUNTIME_WINNING_TICK_INDEX until captured (DeathCancelled/BoundaryCancelled use null because no fixed-tick boundary wins); contact_event_time remains a separate sub-tick diagnostic and never substitutes for terminal_publication_time. These fields are distinct and required even when actual evidence is UNCAPTURED."
    failed_gate_spends.epoch_assertion: "Required on every record. Normal terminal cases use increment=0 and stale_prior_epoch_work=not_applicable; failed_death_01 requires one lifecycle-owned epoch increment before any late callback and stale work rejection."
    failed_gate_spends.stale_work_assertion: "Required only for death-cancelled in-flight records; a late old-epoch callback must be ignored with no collision, timeout, fact, relay, decision, or presented audio."
    failed_gate_spends.reanchor_patrol_clear: "Required on every failed_gate_spends record (Pass A revision B 2026-08-30). The reserve pickup route must be clear of the guard's extended-search patrol zone during the re-anchor timer window. This field records the NavMesh path-clearance probe result: true = the reserve route from the checkpoint is unobstructed by the guard's active-investigation area during the extended re-anchor window; false = the reserve route intersects the guard's extended-search patrol, and the level is not certified until this is resolved. A failed gate pickup that leaves the reserve blocked by the guard's extended search is a certification failure, not a player routing failure."
    failed_gate_spends.reanchor_patrol_zone_id: "The authored investigation-zone marker id used for the re-anchor clearance probe. Identifies the guard's search area around the failed gate pickup's noise origin."
    failed_gate_spends.reanchor_patrol_extend_s: "The extended re-anchor timer duration used for the clearance probe, in seconds. Derived from the registered t_reanchor formula with the level's difficulty scaling parameters."
    failed_gate_spends.reserve_visibility_window: "The guard's extended-search patrol visibility window, in seconds, during which the reserve route must remain clear. Must cover the full reanchor_patrol_extend_s window."
    failed_gate_spends.reserve_reachable_after_extend: "Boolean: true if the reserve pickup is reachable via the recorded NavMesh route after the full re-anchor patrol window expires; false if the reserve becomes reachable only after the guard leaves the area. False is a certification failure."
    trace_contract.source_order: "source_event_class_rank and source_event_id are required for deterministic same-timestamp allocation; movement rank=0 and Burst rank=1. Listener/thread arrival order is never an identity source."
    trace_contract.epoch_barrier: "epoch_transition_id and stale_work_assertion are required when a lifecycle transition invalidates queued or callback work; old-epoch work must not produce a successful record."
    workload_profiles.cap_controls: "Required on every profile and lists the caps exercised by that profile, including Event Bus/retry, hearing/deferred-boundary, frame-delta, Burst backlog, stall magnitude/rate, and boundary/fact/guard/pair controls when applicable. Each profile also requires budget_role, platform_scope, budget_evidence, and component_timer_contract; diagnostic_only profiles must set required_budget_ms=null and can never satisfy a performance gate."
    workload_profiles.budget_evidence: "required_budget_ms is the normative threshold only; budget_evidence is the typed measurement union {status: PENDING_OQ6, value_ms: null} | {status: CAPTURED, value_ms: finite}. PENDING_OQ6 is non-passing and may not be serialized as a scalar threshold or measurement."
    workload_profiles.component_timer_contract: "Every captured profile records frame_time_source, hitch_window_clock_source, timer_resolution_s, render_frame_index_field, and reconciliation_policy; missing provenance or overlap/unexplained residual beyond timer resolution fails TIMER_BOUNDARY_INVALID."
    suppressed_receipt.visibility_not_performed: "A state-exclusion receipt has visibility_query_id=not-applicable and visibility_query_provenance=not-performed:state-exclusion; an eligible receipt must carry one non-empty query id/provenance pair. This distinguishes no authorized query from a queried false result."
  evidence_contract:
    evidence_status: [UNCAPTURED, CAPTURED]
    actual_union:
      - UNCAPTURED
      - {status: CAPTURED, observed: record_specific_typed_object}
    expected_actual_pair: {expected: record_specific_typed_object, actual: actual_union}
    comparison: named_record_tolerance
    missing_fields: fail_closed
  workload_profiles:
    - profile_id: supported_mvp
      purpose: supported_mvp_envelope
      active_guards: 1
      due_facts: 1
