    note: "Consecutive ticks the path-end conjunction must hold before the arm fires (rev 3.7 C1.2 anti-jitter pin)"
    source: design/gdd/guard-ai-fsm.md  # C1.2 / D1 (rev 3.7)
    consumed_by: [Guard AI FSM GDD]

  - name: spot_front_anchor
    value: "Level/hide-system-authored per hide spot"  # world position on the spot's approachable face
    safe_range: "Authored datum — must lie on a guard-reachable surface adjacent to the spot zone (hide-spot certification pins)"
    note: "Spot-front hold position datum (rev 3.7 C1.3): guard holds at anchor offset outward along the approach vector by guard-radius standoff; defines 'reached the spot front' together with eps_arrive"
    source: design/gdd/guard-ai-fsm.md  # C1.3 (rev 3.7)
    owned_by: "Level / hide system (authored per spot)"
    consumed_by: [Guard AI FSM GDD, Level GDD, Hide System GDD]

  - name: interior_position
    value: "Level/hide-system-authored per hide spot"  # the spot's reference point the player occupies while hidden
    safe_range: "Authored datum — must satisfy D1 reach-resolvability + D2 vertical margin against the worst-case guard floor (player-movement-hide hostage pins)"
    note: "HideSpot interior reference (player-movement-hide #5 D1/D2, rev 2026-08-26, updated 2026-09-20): the static datum the FSM's HideSpotFront catch-gate resolves reach-presence against (NOT the player's live feet). Depth/offset must satisfy the D1 OR-invariant (path leg OR occlusion-clear backstop) and the D2 strict authoring margin below delta_y_tolerance; asserts against proxy(interior_position), never raw spot_position. D1 REVISION 2026-08-26 (review Blk-2): the D1 certification bound is catch_range (5.5) — NOT catch_range + margin (6.0), which is the FSM's retained-accrual/pause bound. D1 REVISION 2026-09-20: parameterized standoff requires EuclidXZ(guard_hold, interior_position) <= catch_range - eps_arrive - standoff_margin; backstop Linecast targets aperture_portal_target to prevent prop-mesh self-occlusion."
    source: design/gdd/player-movement-hide.md  # D1/D2 (rev 2026-09-20)
    owned_by: "Level / hide system (authored per spot)"
    consumed_by: [Guard AI FSM GDD, Level GDD, Hide System GDD]

  - name: auth_margin
    value: 0.2
    safe_range: "[0.1, 0.4] m"
    note: "D2 vertical authoring margin (player-movement-hide #5, rev 2026-08-26, updated 2026-09-20): offset(interior, floor_worst) < delta_y_tolerance − auth_margin. Larger = safer against lazy authoring but rejects more spot geometry; smaller = permissive but risks over-tolerance spots reaching the gate (capture-immunity). Load-time joint constraint (rev 2026-09-20): delta_y_tolerance - auth_margin >= 0.3 m is enforced at config load time (REJECT_CONFIG_AUTH_MARGIN_JOINT_VIOLATION), guaranteeing >= 0.20 m step/curb allowance."
    source: design/gdd/player-movement-hide.md  # D2 / Section G
    consumed_by: [Hide System GDD, Level GDD]

  - name: standoff_margin
    value: 0.10
    safe_range: "[0.05, 0.20] m"
    note: "D1 horizontal standoff cushion against minimum catch_range (player-movement-hide #5 §D1, approved 2026-09-20): EuclidXZ(guard_hold, interior_position) <= catch_range - eps_arrive - standoff_margin. Strictly prevents dead-band freeze at lower-bound catch_range = 5.20 m (giving stopped position <= 5.10 m < 5.20 m)."
    source: design/gdd/player-movement-hide.md  # D1 / Section G
    consumed_by: [Hide System GDD, Level GDD]

  - name: t_margin_react
    value: 0.3
    safe_range: "[0.2, 0.5] s"
    note: "D4 through-spot escape human reaction and camera re-alignment buffer (player-movement-hide #5 §D4, approved 2026-09-20). Accounts for player reaction delay upon hearing guard approach during vent/through-spot transit."
    source: design/gdd/player-movement-hide.md  # D4 / Section G
    consumed_by: [Hide System GDD, Level GDD]

  - name: t_spotfront_verify_through
    value: 2.5
    safe_range: "[2.0, 3.5] s"
    note: "D4 through-spot inspection dwell duration at dual-exit apertures (vents/crawlways) (player-movement-hide #5 §D4, approved 2026-09-20). Extended beyond generic single-exit t_spotfront_verify (1.5 s) to provide player crouch-escape travel budget (pathLen <= 5.52 m at starters)."
    source: design/gdd/player-movement-hide.md  # D4 / Section G
    consumed_by: [Guard AI FSM GDD, Level GDD, Hide System GDD]

  # --- Player Third-Person Controller knobs (registered Phase 5b 2026-08-22) ---

  - name: V_crouch
    value: 1.8  # m/s
    safe_range: "[1.4, 2.2] m/s"
    constraint: "JOINT (config-time assert in the H.0.7 validator / AC-P18): V_crouch < V_patrol in EVERY config — the independent bands admit violating corners (2.2 >= V_patrol band-min 2.0), so this is asserted at load, not band-pinned; a crouching player can never outrun even a patrolling guard on open ground (risk-ladder leg). Rev 2026-08-24 (controller review round 1, B6): replaced the unsatisfiable 'across full bands' claim with the joint-assert form."
    source: design/gdd/player-third-person-controller.md  # F1 / Section D
    consumed_by: [Player Controller GDD]

  - name: V_walk
    value: 3.6  # m/s
    safe_range: "[3.2, 4.4] m/s"
    constraint: "JOINT (bands-pinned): V_walk < V_investigate in EVERY config — band top 4.4 pinned against V_investigate band-minimum 4.5; prevents walk from being a dominant strategy (near-run mobility, smaller noise ring, zero escalation risk). Gear-shift perceptibility: shipped starters give walk = 2.0x crouch, but the worst LEGAL corner across independent bands is ~1.45x (3.2/2.2) — the former '>= 1.6x across bands' claim was unsatisfiable. Cadence is a HARD joint constraint (rev 2026-08-28): V_walk / stride_length_walk <= V_run / stride_length_run in every loaded config; the config loader rejects an inversion before play, and the load report records the evaluated ratios for the Pillar-2 audit."
    source: design/gdd/player-third-person-controller.md  # F1/F5 / Section D
    consumed_by: [Player Controller GDD, Player Noise GDD]

  - name: backpedal_factor
    value: 0.70
    safe_range: "[0.60, 0.80]"
    constraint: "backpedal_factor in (0, 1] — BOTH bounds are H.0.7 validator legs (round 4): ceiling > 1 would push backward run past the F2 runtime-max declaration and silently falsify the sup (leg added round 3); floor <= 0 would silently kill backpedaling or invert speed outside the declared v_eff range [0, V_run] (leg added round 4). Backpedal gains distance only DURING the damped reversal window (facing converges within ~T_reverse ~= 0.83 s at starters per F3) and never enables kiting (turn-and-sprint strictly better); part of the F2 empty-modifier-product runtime-max proof"
    source: design/gdd/player-third-person-controller.md  # F1
    consumed_by: [Player Controller GDD]

  - name: eps_d
    value: 0.0001
    safe_range: "locked"
    constraint: "fixed positive comparison epsilon for the C3 backpedal speed boundary; dot < -eps_d applies f_back, dot >= -eps_d uses full speed. F3 turn damping remains continuous through dot = 0."
    source: design/gdd/player-third-person-controller.md  # F1/E2
    consumed_by: [Player Controller GDD]

  - name: turn_rate
    value: 360  # deg/s
    safe_range: "[300, 480] deg/s"
    source: design/gdd/player-third-person-controller.md  # F3
    consumed_by: [Player Controller GDD]

  - name: accel_time
    value: 0.08  # s
    safe_range: "[0.04, 0.10] s (domain 0 < x <= 0.10 — hard <= 0.10 C5 responsiveness contract; floor > 0 because a_max = V_run/accel_time divides)"
    note: "SHARED knob: drives both the speed slew rate (a_max = V_run/accel_time) and the crouch capsule blend (F4 gamma). Split into a dedicated crouch_time only if playtesting demands stance-weight independence. Domain bound enforced by the config validator (AC-P18 leg)."
    source: design/gdd/player-third-person-controller.md  # F1/F4/C5
    consumed_by: [Player Controller GDD]

  - name: h_stand
    value: 1.80  # m
    safe_range: "[1.70, 1.90] m"
    constraint: "JOINT config-time assert in the H.0.7 validator / AC-P18 leg (rev round-6): h_stand > h_crouch — a corrupted h_stand would desync the Guard catch-gate Linecast endpoint operand and Perception's 1.6 m stand-pinned ray origin with no loud failure; bands alone are advisory."
    source: design/gdd/player-third-person-controller.md  # F4
    consumed_by: [Player Controller GDD, Perception GDD]

  - name: h_crouch
    value: 0.95  # m
    safe_range: "[0.85, 0.95] m"
    constraint: "h_crouch < 1.0 HARD (validator-enforced, AC-P11) — keeps the crouched capsule under sub-1.0 m cover geometry with margin; Rev 2026-08-26 (controller review round 4): safe_range top capped from 0.99 to 0.95 — the honest working-range top — so even a band-top config retains >= 0.05 m real margin below sub-1.0 m cover (a 0.96-0.99 value sits inside contact-offset scale, effectively zero margin). Rev 2026-08-24 (controller review round 1, B1): the former k_eye-ratio ray guarantee is STRUCK — Perception consumes the controller's published BINARY stance flag (flip at gamma 0.5) to select its OWNED pinned eye offsets (crouch 0.5 / stand 1.6), so end-to-end concealment is verified in integration tests against the live perception stack, not from h_cap arithmetic. Hide-spot interiors must fit this height (Level GDD soft dep)."
    source: design/gdd/player-third-person-controller.md  # F4
    consumed_by: [Player Controller GDD, Perception GDD, Level GDD]

  - name: eye_offset_crouch
    value: 0.5  # m
    safe_range: "locked"
    constraint: "Perception-owned sensing-ray eye offset selected when controller stance = Crouched; first-class registry datum, not derived from h_crouch."
    source: design/gdd/perception.md  # approved pinned eye-offset convention
    owned_by: "Perception GDD"
    consumed_by: [Perception GDD]

  - name: eye_offset_stand
    value: 1.6  # m
    safe_range: "locked"
    constraint: "Perception-owned sensing-ray eye offset selected when controller stance = Standing; first-class registry datum, not derived from h_stand."
    source: design/gdd/perception.md  # approved pinned eye-offset convention
    owned_by: "Perception GDD"
    consumed_by: [Perception GDD]

  - name: rear_damp_floor
    value: 0.25
    safe_range: "[0.15, 0.40]"
    constraint: "0 < rear_damp_floor < 1 — both bounds are H.0.7 validator legs (AC-P18, round 3): the floor keeps full-rear turning NON-ZERO, the ceiling keeps w <= 1 so rear turns never exceed turn_rate (proportional rear damping, F3; replaces the binary backpedal turn-suspension whose hover trap and diagonal freeze were review round 1 blocker B2)"
    note: "Turn-weight multiplier floor w(dot = -1); w = 1 for dot >= 0, linear in between. Feel-linked to backpedal_factor and turn_rate."
    source: design/gdd/player-third-person-controller.md  # F3 (rev 2026-08-24)
    consumed_by: [Player Controller GDD]

  - name: stride_length_walk
    value: 1.9  # m
    safe_range: "[1.5, 2.4] m"
    constraint: "stride_length_walk > 0 in every loaded config (H.0.7 validator leg, round 4 parity with the run-stride leg — nonpositive strides break threshold semantics)."
    note: "Global audible-distance ledger (F5 rev 2026-08-25, Round-2 blocker 1): Walk contributes actual XZ displacement to one shared ledger; Idle/Crouch force r_noise 0 but freeze the ledger and armed flag without resetting them. The Walk threshold is 1.9 m; fresh-session commit-to-audible is ~0.551 s at starters. Tap-inching can eventually arm after enough total audible-state travel, so key segmentation cannot manufacture silence. SHARED: Player Noise GDD co-signs the freeze-without-reset semantics and step_event stream #3 will consume."
    source: design/gdd/player-third-person-controller.md  # F5 (rev 2026-08-24)
    owned_by: "Player Controller GDD (Player Noise co-sign)"
    consumed_by: [Player Controller GDD, Player Noise GDD]

  - name: stride_length_run
    value: 2.6  # m
    safe_range: "[2.0, 3.2] m"
    constraint: "stride_length_run > stride_length_walk in every loaded config; both strides are also validated positive (H.0.7 legs, round 3 — nonpositive strides break threshold semantics); the cadence joint constraint also requires V_walk / stride_length_walk <= V_run / stride_length_run, so Run's steps-per-second cannot be slower than Walk's."
    note: "Global audible-distance ledger threshold (F5 rev 2026-08-25): Run contributes actual XZ displacement to the shared ledger; Idle/Crouch freeze rather than reset. The Run threshold is 2.6 m; fresh-session commit-to-audible is ~0.456 s at starters. Cadence inversion is a load-time HARD rejection, not a post-load balance warning (rev 2026-08-28). SHARED with Player Noise GDD."
    source: design/gdd/player-third-person-controller.md  # F5 (rev 2026-08-25)
    owned_by: "Player Controller GDD (Player Noise co-sign)"
    consumed_by: [Player Controller GDD, Player Noise GDD]

  - name: cadence_monotonicity_constraint
    value: "cadence_ratio = cadence_walk / cadence_run = (V_walk / stride_length_walk) / (V_run / stride_length_run)"
    safe_range: "ratio-logged on every load; accepted range (0, 0.85]; rejected at load if cadence_ratio > 0.85"
    constraint: "F3(3) HARD cadence-monotonicity and differentiation legs. The Walk pips-per-second `cadence_walk = V_walk / stride_length_walk` MUST be ≤ the Run pips-per-second `cadence_run = V_run / stride_length_run`, and the ratio `cadence_ratio = cadence_walk / cadence_run` MUST be ≤ 0.85. The inverse is rejected because a quieter state emitting pips more frequently than a louder state breaks Pillar 2 readability; a ratio above 0.85 is also rejected because near-equal cadence collapses the player's ability to distinguish Walk and Run commit timing. Starter config gives (3.6/1.9)/(6.25/2.6) ≈ 0.79."
    note: "F3(3) cadence partition: non-finite, zero, or negative cadence inputs use CFG_NONFINITE_INPUT; cadence_ratio > 1 uses CFG_CADENCE_ORDER_INVALID; 0.85 < cadence_ratio ≤ 1 uses CFG_CADENCE_MARGIN_TOO_SMALL; only 0 < cadence_ratio ≤ 0.85 is accepted. The validator logs cadence_walk, cadence_run, cadence_ratio, comparison result, and rejection code for every leg. Both ordering and margin are load-rejection rules, not balance warnings."
    source: design/gdd/player-noise.md  # F3(3) re-derivation 2026-08-30
    owned_by: "Player Noise GDD (Player Controller co-sign)"
    consumed_by: [Player Noise GDD, Player Controller GDD]

  - name: rustle_threshold
    value: 0.70  # ratio of the current stride — fires the controller's rustle_event pre-pip tell (rev 2026-08-27, B5)
    safe_range: "[0.60, 0.80]"
    note: "Audio-only pre-commit rustle, fire-once-per-stride, NEVER a hearing event and absent from the trace schema; emitted by the Player Controller (F5), consumed by audio."
    source: design/gdd/player-third-person-controller.md  # F5 rustle_event (rev 2026-08-27); player-noise.md B5
    owned_by: "Player Controller GDD (Player Noise co-sign)"
    consumed_by: [Player Controller GDD, Player Noise GDD]

  - name: t_repath_min
    value: 0.10  # s
    safe_range: "[0.05, 0.15] s"
    note: "Hard rate-limiting clamp on Chase re-pathing (10 Hz ceiling). Protects the 60 fps (16.6 ms) frame budget against high-frequency player movement."
    source: design/gdd/navmesh-pathfinding.md  # D4
    consumed_by: [NavMesh GDD, Guard AI FSM GDD]

  - name: T_repath
    value: 0.25  # s
    safe_range: "[0.20, 0.50] s"
    note: "Periodic Chase re-pathing cadence. Synchronized with the Perception sensing tick (2-5 Hz)."
    source: design/gdd/navmesh-pathfinding.md  # D4
    consumed_by: [NavMesh GDD, Guard AI FSM GDD]

  - name: Delta_p_trigger
    value: 0.50  # m
    safe_range: "[0.30, 0.80] m"
    note: "Player Euclidean displacement threshold triggering an immediate Chase re-path."
    source: design/gdd/navmesh-pathfinding.md  # D4
    consumed_by: [NavMesh GDD, Guard AI FSM GDD]

  - name: omega_turn
    value: 480.0  # deg/s
    safe_range: "[360.0, 720.0] deg/s"
    note: "NavMeshAgent angular turning speed for crisp cornering."
    source: design/gdd/navmesh-pathfinding.md  # C1.2
    consumed_by: [NavMesh GDD]

  - name: a_max
    value: 16.0  # m/s^2
    safe_range: "[12.0, 24.0] m/s^2"
    note: "NavMeshAgent linear acceleration ensuring immediate speed responsiveness upon alert state transitions."
    source: design/gdd/navmesh-pathfinding.md  # C1.2
    consumed_by: [NavMesh GDD]

  - name: v_size
    value: 0.10  # m
    safe_range: "[0.05, 0.133] m"
    note: "Voxel size for NavMeshSurface bake. Bound by invariant v_size <= r_guard / 3."
    source: design/gdd/navmesh-pathfinding.md  # D5
    consumed_by: [NavMesh GDD, Level GDD]

  - name: margin_corridor
    value: 0.40  # m
    safe_range: "[0.20, 0.60] m"
    note: "Extra horizontal corridor clearance added to 2 * r_guard for W_corridor >= 1.20 m invariant."
    source: design/gdd/navmesh-pathfinding.md  # D6
    consumed_by: [NavMesh GDD, Level GDD]

  - name: r_avoid
    value: 0.45  # m
    safe_range: "[0.42, 0.55] m"
    note: "RVO obstacle avoidance radius (r_guard 0.40 m + 0.05 m buffer) to prevent capsule snagging."
    source: design/gdd/navmesh-pathfinding.md  # C1.8
    consumed_by: [NavMesh GDD]

