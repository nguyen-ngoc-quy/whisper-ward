    note: "HideSpot interior reference (player-movement-hide #5 D1/D2, rev 2026-08-26): the static datum the FSM's HideSpotFront catch-gate resolves reach-presence against (NOT the player's live feet). Depth/offset must satisfy the D1 OR-invariant (path leg OR occlusion-clear backstop) and the D2 strict authoring margin below delta_y_tolerance; asserts against proxy(interior_position), never raw spot_position. D1 REVISION 2026-08-26 (review Blk-2): the D1 certification bound is catch_range (5.5) — NOT catch_range + margin (6.0), which is the FSM's retained-accrual/pause bound. A leg at (5.5, 6.0] is certifiable under the retired bound but never engages the catch timer (capture-immunity stalemate)."
