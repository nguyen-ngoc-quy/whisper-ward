  - name: proxy_azimuth_band_deg
    value: 45
    safe_range: "[30, 60] deg"
    note: "Coarse azimuth quantization step for the guard-proxy reception cue payload (Player Noise B8, 2026-09-01): quantized_azimuth = ceil(azimuth_to_guard / proxy_azimuth_band_deg) bands; the step is registry-backed so presentation can never recover the exact guard bearing. Larger = coarser (safer, less useful direction feel); smaller = finer (better direction feel, more position leakage)."
    source: design/gdd/player-noise.md  # guard-proxy quantization (B8, 2026-09-01)
    owned_by: "Player Noise GDD (Audio/UI co-sign)"
    consumed_by: [Player Noise GDD, Audio & UI GDD]

  - name: proxy_distance_bands_m
    value: [0, 4, 8, 12]
    safe_range: "Monotonic increasing band edges; outermost edge ≥ R_burst (10.5) so every in-range fact maps to a band"
    note: "Coarse distance quantization bands for the guard-proxy reception cue payload (Player Noise B8, 2026-09-01): distance_band = the index of the band containing the XZ distance to the guard; band edges are registry-backed so presentation can never recover the exact distance. Bands need not be uniform; the outermost edge must cover the full hearing domain (R_burst on the ground plane) so no in-range fact falls off the band set."
    source: design/gdd/player-noise.md  # guard-proxy quantization (B8, 2026-09-01)
    owned_by: "Player Noise GDD (Audio/UI co-sign)"
    consumed_by: [Player Noise GDD, Audio & UI GDD]

  - name: proxy_occlusion_bands
    value: [clear, occluded]
    safe_range: "locked enum"
    note: "Coarse occlusion quantization for the guard-proxy reception cue payload (Player Noise B8, 2026-09-01): occlusion_band = clear when the B1 visibility Linecast is clear, occluded when it is blocked. Binary by design — matching the binary Linecast contract; no partial-attenuation bands exist (B9 binary-portal ruling, 2026-08-27)."
    source: design/gdd/player-noise.md  # guard-proxy quantization (B8, 2026-09-01)
    owned_by: "Player Noise GDD (Audio/UI co-sign)"
    consumed_by: [Player Noise GDD, Audio & UI GDD]

  - name: audio_cue_id_contract
    value: "(session_id, attempt_epoch, cue_kind, local_sequence)"
    safe_range: "local_sequence is monotonic and non-reused within the session/epoch/cue_kind namespace; retries, duplicates, callbacks, cancellation, stale rejection, and unsupported integration retain the same id"
    note: "Audio/UI allocates audio_cue_id when a cue request is created. It is presentation evidence only and never replaces fact_id, source_event_id, or entry_id, and never creates gameplay facts or decisions. Every AudioOnsetRecord serializes the id, including visual-only and cancelled requests."
    source: design/gdd/player-noise.md  # AC19 cue identity ownership
    owned_by: "Audio/UI integration (Player Noise co-sign)"
    consumed_by: [Player Noise GDD, NoiseFixtureSpec, sound_performance_audit.md]
  - name: audio_cue_applicability
    value: [audible, visual_only]
    safe_range: "locked enum; visual_only cues are outside DSP onset and limiter pass gates"
    note: "Every cue record declares whether it has an audible audio integration obligation. Audible cues, including Pickup Confirmation, are subject to the AC19 onset contract; visual_only cues record onset_evidence=not_applicable and limiter_evidence=not_applicable, never a fabricated passing state. An audible cue may use limiter_evidence=not_applicable only when it explicitly declares that it is outside the registered limiter bus scope. Suppressed micro-tell is visual_only with zero proxy audio. OQ3 middleware selection remains pending."
    source: design/gdd/player-noise.md  # AC19 cue applicability normalization
    owned_by: "Player Noise GDD (Audio co-sign)"
    consumed_by: [Player Noise GDD, Audio & UI GDD, NoiseFixtureSpec]
  - name: audio_onset_report_states
    value: [confirmed, estimated, pending, unsupported]
    safe_range: "locked enum"
    note: "AC19 onset evidence states (rev 2026-08-31 — replaces the unexecutable generic 'virtual_dsp_onset' Wwise DSP-onset oracle; a generic Wwise SFX scheduled-start callback does not exist and is never assumed). PASS/FAIL mapping fixed 2026-08-31 (clean full re-review, user-selected): ONLY confirmed is passing evidence. confirmed = the audio integration reports an actual DSP sample start; the |reported − requested| gap is checked against audio_cue_onset_tolerance_ms on the injected virtual clock — PASSING. estimated = the integration reports an estimated sample start (derived from the integration's own reported markers/duration — NEVER an unregistered hardcoded pipeline-latency constant) — NON-PASSING; a later confirmed arrival updates the record for TRACE ONLY and can never flip an estimated record to passing (the prior retroactive-fail clause is struck: evidence that can flip after the fact is not deterministic). pending = the onset report has not arrived — NON-PASSING; the pending record is diagnostic metadata (pending_onset_record) only and never authorizes late playback after a missed virtual gameplay deadline. unsupported = no audio integration exists in the environment; the fixture records DSP_onset_unsupported — NON-PASSING. Pause semantics: audio cues are never buffered across pause; a cue whose virtual deadline passes while paused is cancelled before presentation (audio_stale_cancellation_policy)."
    source: design/gdd/player-noise.md  # AC19 estimated-onset contract (fresh re-review 2026-08-30, user-selected)
    owned_by: "Player Noise GDD (Audio co-sign)"
    consumed_by: [Player Noise GDD, Audio & UI GDD]
  - name: audio_onset_record_contract
    value: "immutable onset_outcome + append-only onset_trace_history[] for audible cues"
    safe_range: "audible onset_outcome ∈ {confirmed, estimated, pending, unsupported}; only confirmed passes; visual_only = not_applicable"
    note: "AC19 field contract: each audible cue records one immutable onset_outcome plus append-only onset_trace_history[]. A visual_only cue records explicit not_applicable evidence and is outside the DSP onset gate. confirmed requires an actual integration-reported DSP sample-start readback within audio_cue_onset_tolerance_ms against the virtual cue request; estimated, pending, and unsupported are non-passing. A late confirmed report appends trace only and never retroactively changes the outcome. DSP conversion records dsp_start_sample, sample_rate, and epoch_offset when available; an estimated onset serializes its estimate only in the dedicated nullable dsp_start_sample_estimate field and never populates dsp_start_sample; absent reports remain explicit rather than zero-filled. The canonical comparison vocabulary is virtual_cue_request (gameplay-side request) and virtual_dsp_onset = (dsp_start_sample / sample_rate) + epoch_offset (converted comparison value). Middleware and the concrete per-platform readback mechanism remain OQ3/ADR-0003 dependencies."
    source: design/gdd/player-noise.md  # AC19 field parity normalization 2026-09-02
    owned_by: "Player Noise GDD (Audio co-sign)"
    consumed_by: [Player Noise GDD, Audio & UI GDD, NoiseFixtureSpec]
  - name: audio_onset_evidence_fields
    value: [voice_instance_id, dsp_start_sample, sample_rate, audio_clock_source, integration_source, epoch_offset, child_voice_evidence]
    safe_range: "voice_instance_id and absolute dsp_start_sample are mandatory for onset_outcome=confirmed; body/accent child voice evidence is required for a two-voice blend; sample_rate, audio_clock_source, integration_source, and epoch_offset identify adapter-owned absolute clock/sample provenance"
    note: "Clip-relative AudioSource.timeSamples is adapter input/diagnostic data only and cannot establish confirmed onset. Confirmed onset requires adapter-owned voice_instance_id, absolute dsp_start_sample, sample_rate, audio_clock_source, integration_source, and epoch_offset compared against the virtual cue request using the registered audio_cue_onset_tolerance_ms floor/default. A logical body+accent blend groups child reports under one audio_cue_id and requires role-typed body/accent evidence; estimated, pending, unsupported, and missing evidence remain non-passing."
    source: design/gdd/player-noise.md  # AC19 AudioFeedbackFixture evidence contract
    owned_by: "Player Noise GDD (Audio co-sign)"
    consumed_by: [Player Noise GDD, Audio & UI GDD, NoiseFixtureSpec]
  - name: audio_limiter_evidence_states
    value: [limiter_reported, limiter_stock_desktop, limiter_stock_webgl, limiter_unsupported, not_applicable]
    safe_range: "locked enum; limiter_unsupported is non-passing; limiter_stock_desktop satisfies desktop platform leg with peak ceiling ≤ 0 dBFS and onset tolerance ≤ 22 ms; limiter_stock_webgl satisfies WebGL platform leg under OQ3; not_applicable is excluded from the dBTP gate"
    note: "AC19 dBTP evidence is separate from onset_outcome and is a typed union: limiter_reported requires finite true_peak_dbTP, nonempty limiter_stage_id, bus_id, and measurement_source plus an actual true-peak limiter-stage report within the ≤ −1 dBTP bound; limiter_stock_desktop records stock Unity master non-clipping peak ceiling (≤ 0 dBFS) and virtual clock onset tolerance (≤ 22 ms) without requiring native true-peak C++ DSP readback (rev 2026-09-20); limiter_stock_webgl records browser soft-knee limiter evidence on WebGL builds under OQ3 without requiring native C++ DSP readback (rev 2026-09-19); limiter_unsupported requires a reason and null true_peak_dbTP, records the absence of a qualifying limiter, and is fail-closed, never a pass; not_applicable requires reason ∈ {visual_only, out_of_scope}, null true_peak_dbTP, and is used only outside the registered limiter bus scope and is not evaluated as a pass."
    source: design/gdd/player-noise.md  # AC19 limiter field parity normalization 2026-09-02; stock desktop partition 2026-09-20
    owned_by: "Player Noise GDD (Audio co-sign)"
    consumed_by: [Player Noise GDD, Audio & UI GDD, NoiseFixtureSpec]
  - name: stall_magnitude_budget_ms
    value: 33  # ms — per-hitch magnitude ceiling for an intentional out-of-budget render stall (WebGL hitch)
    safe_range: "locked at the WebGL 33 ms hitch"
    note: "A render stall is an intentional out-of-budget frame; a single stall is permitted only if its magnitude ≤ 33 ms. This is the magnitude half of the separate stall budget (AC21 perf gate, fresh-session re-review 2026-08-28) — paired with stall_rate_cap_per_s so hitches are bounded in both size and frequency, never an open-ended steady-state exclusion."
    source: design/gdd/player-noise.md  # performance gate (re-review 2026-08-28)
    owned_by: "Player Noise GDD (Physics co-sign)"
    consumed_by: [Player Noise GDD, Physics GDD, sound_performance_audit.md]
  - name: stall_rate_cap_per_s
    value: 1  # hits/sec — maximum permitted stall rate (starter; tune at OQ6 hardware run)
    safe_range: "[0, 4] hits/sec"
    note: "The rate half of the separate stall budget (AC21 perf gate): a hitch is permitted only if its rate ≤ this cap. Rate is measured over a sliding 1 s window; the (N+1)th hitch landing within any 1 s window beyond the cap is a perf failure, not a steady-state exclusion. Starter 1/s; the OQ6 WebGL hardware run sets the final value."
    source: design/gdd/player-noise.md  # performance gate (re-review 2026-08-28)
    owned_by: "Player Noise GDD (Physics co-sign)"
    consumed_by: [Player Noise GDD, Physics GDD, sound_performance_audit.md]

  - name: performance_fixture_ownership
    value: "PerformanceFixture (normative role 11 of the 11-role mandatory set, schema WW-PERF-1.0)"
    safe_range: "locked ownership assignment"
    note: "AC21 owner assignment (rev 2026-08-31, user-selected): the named PerformanceFixture — added to the mandatory fixture set as its 11th member — owns the AC21 performance harness. It defines two profiles: supported_mvp (1 guard / 1 fact / 1 Burst flight, ≤ 2.0 ms p95/p99 per hearing_burst_perception_budget_ms — the SUPPORT envelope) and diagnostic stress_30_guard_8_fact (240 candidate pairs, 30 evaluated, 210 deferred — diagnostic coverage, NEVER a support promise, never a gating pass). Rev 2026-08-31 (clean full re-review, user-selected rebinding): the ACCEPTANCE gate is the whole-frame webgl_whole_frame_budget_p95_ms (33.0 ms p95 at the 30 fps floor) measured on target WebGL hardware; the 2.0 ms slice and the aggregate_webgl_frame_budget_ms (12.0 ms) are its decomposition records for supported_mvp, reported per subsystem — the prior AC21 wording that bound 2.0 ms to the 30-guard case and gated only subsystem slices is STRUCK. Measurement boundary MUST include Physics.autoSyncTransforms state, the one bounded Physics.SyncTransforms call per Burst batch, Event Bus handoff cost, audio main-thread cost, hearing evaluation, and Burst simulation. Whole-frame accounting MUST record `whole_frame_ms = render_ms + player_noise_path_ms + hidespot_phase2_ms + fsm_catch_gate_ms + other_main_thread_ms`; render, HideSpot phase 2, FSM catch-gate, and residual main-thread work are mandatory components and cannot be omitted from the AC21 record. PENDING_OQ6 remains explicitly NON-PASSING: an uncaptured/unsupported-platform run cannot satisfy AC21, and no diagnostic stress result can substitute for the supported-MVP measurement."
    source: design/gdd/player-noise.md  # AC21 ownership (fresh re-review 2026-08-30)
    owned_by: "Player Noise GDD (Technical Setup co-sign)"
    consumed_by: [Player Noise GDD, sound_performance_audit.md, PerformanceFixture]

  - name: noise_source_catalog
    value: "MVP: {movement, burst} — exactly two channels"
    enum_domain: [movement, burst]
    safe_range: "MVP-locked source set; Target extension requires its own GDD"
    note: "MVP noise-source boundary (rev 2026-08-31): the NoiseEmitter's MVP source set is EXACTLY {movement (step_event relay), burst (landing publication)} — scoped to the MVP profile, not a permanent invariant. No persistent/looped emitter, no Lure object, no environmental-noise authoring exists in MVP; MVP fixtures REJECT any third noise kind. Target-tier Lure (game-concept Pillar 3) enters ONLY through its own dedicated GDD and schema revision under the gated Target profile (AlertPropagation capability handshake) — it will reuse the raw NoiseEmitter publication and Perception hearing contracts but never the Burst throw/spend/pickup lifecycle or the movement step_event path. No implementation may add a Lure source under the current Player Noise document revision."
    source: design/gdd/player-noise.md  # MVP noise-source boundary (fresh re-review 2026-08-30)
    owned_by: "Player Noise GDD (Game Concept co-sign)"
    consumed_by: [Player Noise GDD, Perception GDD, Guard AI FSM GDD, Level GDD]

  - name: fixture_tolerance_classes
    value: "gameplay_contract ≤ 5×10⁻³ m; oracle_quantizer ≤ 1×10⁻³ m absolute; pure_math_relative ≤ 1×10⁻⁶ relative"
    safe_range: "locked three-class policy"
    note: "Tolerance classes (rev 2026-09-01): (1) gameplay_contract — the 5 mm CompareTolerance gate for gameplay-assertion comparisons (including AC15b re-anchor assertions); (2) oracle_quantizer — the 1 mm absolute tolerance for expected-vs-computed static-oracle records (receiver/occlusion probes); (3) pure_math_relative — the 1×10⁻⁶ relative precision for pure mathematical F4/oracle comparisons only. Every tolerance-bearing fixture record MUST declare exactly one class; the validator gates per class, and an unlabeled generic formula tolerance fails closed. The pure_math_relative class is never a gameplay tolerance."
    source: design/gdd/fixtures/noise-fixture-spec.md  # tolerance-class reconciliation (fresh re-review 2026-08-30)
    owned_by: "Player Noise GDD (QA co-sign)"
    consumed_by: [Player Noise GDD, Level GDD, PerformanceFixture]

  - name: validation_leg_split
    value: "ConfigValidatorFixture (runtime config) vs LevelFixture (authored content) — disjoint failure-code namespaces"
    safe_range: "locked validator split"
    note: "AC10/AC20 validation split (rev 2026-08-31): runtime configuration validation (global config domain, finite values, angle domain, canonical dt_max, radius ordering, cadence monotonicity) is owned by ConfigValidatorFixture with the CFG_* failure-code namespace; authored content certification (authored h_landing, discriminant/root per volume, selected root, R_actual band, clearance, landing surface, envelope, gate causality, route evidence, restart transaction) is owned by LevelFixtureValidator with the existing LVL/registry result-code set (INVALID_F4_RANGE, MISSING_LANDING_SURFACE, etc.). Neither validator synthesizes the other's evidence; a runtime config fixture never certifies level volumes and a level fixture never asserts global config values."
    source: design/gdd/player-noise.md  # AC10/AC20 validator split (fresh re-review 2026-08-30)
    owned_by: "Player Noise GDD (QA co-sign)"
    consumed_by: [Player Noise GDD, Level GDD, PerformanceFixture]
  - name: config_validation_codes
    value: [CFG_RADIUS_ORDER_INVALID, CFG_CADENCE_ORDER_INVALID, CFG_CADENCE_MARGIN_TOO_SMALL, CFG_NONFINITE_INPUT, CFG_INVALID_DT_MAX, CFG_INVALID_ANGLE]
    safe_range: "stable ConfigValidatorFixture codes; no code may be mapped to PASS"
    note: "The CFG_* namespace is explicit and finite. Zero/negative/non-finite values map to CFG_NONFINITE_INPUT (with invalid dt_max using CFG_INVALID_DT_MAX); angle, dt_max equivalence, radius ordering, cadence ordering, and cadence-margin legs map to CFG_INVALID_ANGLE, CFG_INVALID_DT_MAX, CFG_RADIUS_ORDER_INVALID, CFG_CADENCE_ORDER_INVALID, and CFG_CADENCE_MARGIN_TOO_SMALL respectively. ConfigValidatorFixture owns these runtime-config failures; LevelFixture result codes remain disjoint and cannot satisfy a CFG_* failure."
    source: design/gdd/player-noise.md
    owned_by: "ConfigValidatorFixture / Player Noise GDD"
    consumed_by: [Player Noise GDD, NoiseFixtureSpec, PerformanceFixture]

  - name: full_room_restart_transaction
    value: "one atomic, player-discoverable recovery transaction"
    safe_range: "locked transactional semantics"
    note: "Restart contract (rev 2026-08-31): the full-room restart is ONE atomic transaction — (1) cancel/invalidate any InFlight Burst flight without refund; (2) discard pending prior-epoch noise facts, queued relays, and hearing work; (3) reset player, guard, gate markers, exit, and movement ledger to the authored attempt state; (4) restore ALL authored pickups to Placed (clears the carried slot); (5) open a new session envelope with a globally fresh, never-reused session_id and attempt_epoch = 1 per the lifecycle transition table; (6) clear residual wariness and pending telegraphs to the authored attempt state. PARTIAL APPLICATION IS A FAILURE, NOT A STATE — the transaction is all-or-nothing and LevelFixtureValidator asserts atomicity with RESTART_NOT_ATOMIC. Player-facing discoverability: the restart is exposed as an explicit pause-menu entry plus a post-double-spend prompt (both pickups Consumed) and is documented in-game as the only path that restores spent pickups; death/segment reset NEVER restores a thrown Burst. The restart affordance is owned by Game Flow/Input; the state transaction is owned by Session/Lifecycle; gate/objective reset is owned by Level."
    source: design/gdd/player-noise.md  # restart transaction (fresh re-review 2026-08-30)
    owned_by: "Player Noise GDD (Session/Lifecycle co-sign)"
    consumed_by: [Player Noise GDD, Level GDD, Guard AI FSM GDD]

