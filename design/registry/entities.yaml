production_hearing_path:  # canonical 4-stage pipeline NoiseEmitter -> Event Bus -> PerceptionHearingService -> FSM (Pass A revision B 2026-08-30)
  source: design/gdd/player-noise.md  # §Production hearing path; reproduced for registry authority
  canonical_producer: design/gdd/player-noise.md
  referenced_by: [design/gdd/perception.md, design/gdd/guard-ai-fsm.md, design/gdd/player-movement-hide.md, docs/architecture/adr-0001-event-messaging-bus.md]
  stages:
    - stage: 1
      name: source_validation_and_allocation
      owner: NoiseEmitter
      identity_produced: fact_id
      identity_propagated: "(session_id, attempt_epoch, source_event_id) -> fact_id (emitter-allocated, deterministic same-timestamp order)"
      terminal_failure_code: burst-launch-blocked
      notes: "Movement rejection (zero-displacement, malformed, out-of-order, duplicate) is logged and produces no fact; Burst preflight overlap rejects before spend and keeps Carried."
    - stage: 2
      name: transactional_event_bus_handoff
      owner: Event Bus (ADR-0001)
      identity_propagated: "(session_id, attempt_epoch, fact_id) envelope retained as handoff_pending until every active Perception token subscription returns a verdict"
      terminal_failure_code: event-bus-downstream-handoff-retry-exhausted
      notes: "Bus owns handoff failure; retry never allocates a new fact_id; the envelope is immutable and is never silently replaced."
    - stage: 3
      name: hearing_scheduler_admission
      owner: Perception (PerceptionHearingService, R5)
      identity_produced: entry_id
      identity_propagated: "Perception-allocated entry_id at first-eligible relay of a live episode; otherwise relays the live entry_id from the latest event-sourced FSM liveness snapshot"
      terminal_failure_code: perception-hearing-deadline-missed
      notes: "Perception owns deadline miss; T_hearing is a success-or-explicit-failure deadline; the active subscription is the ADR-0001 token subscription, and the per-boundary guard/fact selection is a snapshot of that subscription."
    - stage: 4
      name: relay_consumption
      owner: Guard AI FSM
      identity_propagated: "consumed | ignored | stale outcome recorded as a separate keyed outcome record; the relay is never mutated"
      terminal_failure_code: stale
      notes: "FSM never allocates or re-derives fact_id or entry_id; ignored covers live-epoch suppression (HideSpotFront, Chase, cooldown, higher-ranked facts); stale covers epoch/terminal invalidation."
  identity_propagation_order: "fact_id -> envelope identity -> entry_id -> FSM consumption outcome"
  invariants:
    identity_reuse_within_session_epoch: "Identities are unique within (session_id, attempt_epoch); no stage re-derives an upstream identity."
    terminal_failure_owner_split: "Bus owns handoff failure (event-bus-downstream-handoff-retry-exhausted); Perception owns deadline miss (perception-hearing-deadline-missed); no late relay is silently admitted."
    snapshot_vs_subscription: "Per-boundary guard/fact selection is a SNAPSHOT of the active token subscription; subscription is the persistent handle, snapshot is the per-boundary data."

liveness_fact_lifecycle:  # Per-guard liveness fact publication/closure events; Pass A revision B 2026-08-30
  source: design/gdd/guard-ai-fsm.md  # Liveness fact publication; reproduced for registry authority
  canonical_producer: design/gdd/guard-ai-fsm.md
  referenced_by: [design/gdd/perception.md, design/gdd/player-noise.md]
  owner: "Guard AI FSM is the sole normal publisher; Session/Lifecycle owns the attempt_epoch barrier and delegates stale-close publication to GuardAISystem"
  scope: per guard_eid
  session_envelope: [session_id, attempt_epoch, guard_eid, entry_id]
  position_sources: [opener_decision, episode_position, terminal_decision, last_authoritative_episode_position]
  stale_close_handoff: "Session/lifecycle owner submits exactly one StaleLivenessClose per live prior-epoch key before queue invalidation; GuardAISystem publishes the single stale close. The owner never publishes a duplicate. The Event Bus deduplication key is (session_id, attempt_epoch, guard_eid, entry_id, op, source_timestamp), ordered by (source_timestamp, guard_eid, entry_id, op); source_timestamp is the exact epoch-transition time. The barrier commits only after retention or a fail-closed barrier record."
  position_contract: "LivenessFact.position is finite world-space data: op=open uses opener_decision from the matching investigate-commit or Chase-entry; op=promote uses episode_position from the last authoritative episode target/decision; normal op=close uses terminal_decision from the matching resolution/Chase-end/witness-Capture; stale close uses last_authoritative_episode_position from the liveness ledger immediately before invalidation."
  openers:
    - event: investigate-commit
      tier: Investigate
      cause_values: [noise, sight-committed, cap-forced, hide-entry]
      effect: "Perception sees the live entry_id; subsequent eligible noise relays carry the same id."
    - event: Chase-entry
      tier: Chase
      cause_values: [threshold, hide-entry]
      effect: "Perception sees the live entry_id; Chase-tier live episode suppresses new Investigate-tier commits."
  promotions:
    - event: Investigate_to_Chase
      op: promote
      tier: Chase
      cause_values: [threshold, hide-entry]
      effect: "The existing live episode changes tier in place; entry_id and episode identity are retained, no second open is emitted, and Perception continues relaying the same entry_id until the eventual closer."
  closers:
    - event: investigate-resolution
      tier: Investigate
      cause_values: [fruitless, sight-committed, cap-forced, capture, redirected, abandoned]
      effect: "Perception sees no live episode; the next eligible relay may reserve a new entry_id."
    - event: Chase-end
      tier: Chase
      cause_values: [capture, duration_cap, giveup, resight_cap, occupancy-exit, sight-committed, abandoned]
      effect: "Perception sees no live episode; A and R resume (R6/R9). capture covers the catch-gate/interior-capture Chase tier; duration_cap is the absolute Chase time cap; giveup is the lost-LOS-and-reachability budget exhaustion; resight_cap is the resight-count limit; occupancy-exit is a HideSpot-front hold released by a HideSpot-occupancy exit fact (the hold exit wins over a same-boundary catch check); sight-committed covers sight-driven terminations; abandoned is the fallback when no specific cause was recorded. An attempt_epoch stale close uses cause=stale under lifecycle_closure, never a Chase-end cause value."
    - event: Capture
      tier: Investigate-witnessed-interior-inspection
      cause_values: [carve_out_interior_inspection]
      effect: "Perception sees no live episode; meter exits to Idle without a paired Chase-end (CR-PERCEPTION-01)."
  lifecycle_closure:
    - event: attempt_epoch_transition
      cause_values: [death, capture, respawn, segment_reset, full_room_restart, scene_reload, new_playable_attempt]
      effect: "Every guard's live episode is closed in the prior epoch before current-epoch processing; the close is recorded as stale."
  invariants:
    entry_id_no_alloc_when_live: "Perception never allocates a new entry_id while the guard's liveness fact is in the open window; relays carry the live entry_id."
    liveness_window_exactly_open_close: "A guard has at most one live episode at any time; the liveness window is [opener, closer], an Investigate_to_Chase promotion is an in-place tier change, and the episode never reopens within itself."
    event_sourced_no_sync_query: "Perception reads the prior published liveness fact at the previous boundary; it never queries the FSM synchronously to decide allocation."
    publication_precedes_next_hearing_drain: "The FSM publishes open, promote, and close liveness facts before the next hearing drain; a fact emitted after a drain is visible only at the following boundary. This ordering closes cross-boundary duplicate-entry reservation races."
    closure_cause_matches_record: "The liveness closure cause equals the closure record's cause field; the lifecycle/session owner initiates exactly one stale-close handoff before invalidation, GuardAISystem publishes it, and Event Bus deduplication prevents a duplicate."
    id_uniqueness_per_session_epoch: "Within (session_id, attempt_epoch, guard_eid), a new entry_id is allocated only after the prior liveness window is closed (and the prior id is never reused for a new episode)."

trace_event_schema:
  source: design/gdd/perception.md  # R12 v3.2 (C-4 pin); contract-hardening revision 2026-08-28
  direction_note: "Perception publishes sensing FACTS; Guard AI FSM publishes DECISIONS. Every sensing fact and decision carries session_id + attempt_epoch. NoiseEmitter validates/deduplicates source events, allocates fact_id, and publishes raw NoisePublished; Perception owns hearing admission, relay creation, residual_at_hearing, and entry_id reservation; the FSM owns relay consumption outcomes and all behavioral decisions, allocating/deriving neither identity. The lifecycle/session owner alone increments attempt_epoch and atomically invalidates old queues."
  envelope: [session_id, attempt_epoch, timestamp, publisher]
  raw_event_types:
    - name: Source rejection
      fields: [session_id, attempt_epoch, source_event_id, source_kind, invalid_field_or_validation_reason, rejection_code, publisher, input_identity, actual]
    - name: NoisePublished
      fields: [session_id, attempt_epoch, kind, source, movement_mode, resolved_nominal_radius, position, radius, fact_id, fact_publication_state, source_timestamp, terminal_publication_time, t_publish, timestamp, publisher, source_event_class_rank, source_event_id]  # raw emitter fact; movement_mode/resolved_nominal_radius are required for movement and not applicable to Burst; serialized source_event_id = step:<step_id> for Movement or flight:<flight_handle_id> for Burst, while bare IDs remain internal allocation/dedup fields; source_event_class_rank movement=0/Burst=1; t_publish = source_timestamp for Movement and terminal_publication_time for Burst; terminal_publication_time is not applicable to Movement; fact_id is allocated once at accepted raw-fact publication after source-event deduplication; fact_publication_state = published|rejected|invalidated (the raw fact record exists only in these states; not_applicable/pending are Burst terminal record states) and requires nonzero fact_id exactly when published
    - name: Liveness fact
      fields: [session_id, attempt_epoch, guard_eid, entry_id, op, tier, cause, position, position_source, source_timestamp, timestamp, evaluated_at, publisher]  # FSM-owned liveness snapshot write (Pass A revision B 2026-08-30): entry_id is the opaque Perception-owned string carried unchanged by the FSM; source_timestamp is the lifecycle source ordering time, evaluated_at is the FSM publication/evaluation time, and Perception reads the prior published liveness fact at the previous boundary; the FSM publishes open/close on every commit/resolution and promote on an in-place Investigate_to_Chase transition (op=open|promote|close); publisher = GuardAISystem; AC12-P coverage requires this record to exist and to be writable by the FSM
  event_types:
    - name: LOS gain
      fields: [source, distance, guard, timestamp, publisher]  # publisher = sensing-fact (Perception)
    - name: LOS break
      fields: [source, distance, guard, timestamp, R, break_type, causal_class, guard_yaw_delta, a_pre_break, threshold_applied, spot_position, hide_spot_id, entry_id, publisher]  # R = numeric R at break (rev 3.2); break_type: hide | wall | segment; causal_class (rev 3.1 ADJ-2 + rev 3.2 ruling + rev 3.3 J4): peek-out | guard-sweep | hide-dive | wall/segment | segment — the R7/R11 cancel counter consumes peek-out and player-attributed wall/segment; guard-sweep/hide-dive/segment never increment it (rev 3.2); guard_yaw_delta = cumulative-ABSOLUTE head yaw change during the window (J4 classifier channel, net rotation rejected); a_pre_break + threshold_applied = CR-FSM-01 amendment (rev 3.6): present on HIDE-DIVE breaks only — a_pre_break is the numeric accumulated alert at the last pre-break sight tick, threshold_applied is T_hide_entry(R) evaluated at that same tick; spot_position + hide_spot_id + entry_id = CR-FSM-01b extension (rev 3.7): also HIDE-DIVE breaks only — the entered spot's authored world position + ID and the Perception-allocated episode id at the direct hide-entrance open (the FSM's fallback/Chase targets and entry_id relay consume these — FSM C1.3/C1.5); NO-ALLOC-WHEN-LIVE (rev 3.8): the hide-entrance allocation fires only when the guard signals no live episode via the published live-Investigate/GuardGoalMode facts — otherwise the break fact relays the live episode's existing entry_id (retarget-under-suppression path, FSM C1.3); the FSM's hide-entry tier gate compares a_pre_break vs threshold_applied (Chase if a_pre_break >= threshold_applied, Investigate-commit cause=hide-entry fallback otherwise)
    - name: Noise heard
      fields: [session_id, attempt_epoch, kind, source, movement_mode, resolved_nominal_radius, position, radius, guard_eid, fact_id, entry_id, source_timestamp, terminal_publication_time, t_publish, source_event_class_rank, source_event_id, evaluated_at, residual_at_hearing, consumption, timestamp, publisher]  # immutable Perception relay retaining the raw publication contract; guard_eid is the stable guard identity for this guard/fact pair; movement_mode/resolved_nominal_radius are required for movement and not applicable to Burst; fact_id is shared across hearing guards; entry_id is a Perception-owned reservation allocated after hearing admission and before FSM precedence only when the latest liveness snapshot has no live episode, otherwise the live id is relayed; t_publish = source_timestamp for Movement and terminal_publication_time for Burst; admission consumption=eligible; final consumed|ignored|stale is a separate keyed outcome record, never an in-place mutation or command
    - name: Noise consumption outcome
      fields: [session_id, attempt_epoch, fact_id, guard_eid, entry_id, consumption, timestamp, publisher]  # FSM-owned immutable relay outcome; Perception accepts matching identities idempotently, rejects mismatches diagnostically, and never treats consumption alone as liveness closure
    - name: Burst terminal
      fields: [session_id, attempt_epoch, flight_handle_id, winning_tick_index, source_timestamp, terminal_publication_time, t_publish, terminal_cause, burst_state_after, flight_elapsed_s, contact_fraction, contact_event_time, timeout_boundary_s, comparison_result, terminal_position, resolved_velocity, fact_publication_state, fact_id, timestamp, publisher]  # event-time collision/timeout/death-cancellation record; winning_tick_index is the inclusive fixed-tick winner; terminal_cause = Collision|Timeout|DeathCancelled|BoundaryCancelled and burst_state_after = Landed|Consumed are separate fields; BoundaryCancelled is a fail-closed diagnostic terminal for malformed contact data or simulation divergence — it records no publication time, t_publish, fact ID, or hearing deadline and emits no raw fact; source_timestamp is the accepted Throw input-edge ordering time; terminal_publication_time is the absolute virtual time of the winning integer fixed-tick boundary, (start_tick + winning_tick) × dt_max, for Collision and Timeout, or the death-cancellation time for DeathCancelled, and is null for BoundaryCancelled — the sub-tick interpolated contact_event_time is a derived diagnostic field and is never the collision publication time; t_publish equals terminal_publication_time only for a published Collision/Timeout fact and is not applicable for DeathCancelled and BoundaryCancelled; fact_publication_state = not_applicable|pending|published|rejected|invalidated; fact_id is nullable and nonzero only when published; contact_fraction/contact_event_time are null for timeout/death/boundary cancellation; exactly one terminal winner; contact_event_time = flight_elapsed + contact_fraction × dt_max (alpha=0 for initial-overlap terminal check) and is a derived fixed-step event time, never used as source_timestamp; resolved_velocity is the authoritative terminal snapshot and is finite for Collision/Timeout, not_applicable for DeathCancelled.
    - name: Queue rejection
      fields: [session_id, attempt_epoch, queue_item_kind, guard_eid, source_kind, source_timestamp, terminal_publication_time, t_publish, deadline, source_event_id, fact_id, queue_name, queue_state, queue_depth, queue_capacity, retry_count, rejection_code, timestamp, publisher]  # reject-newest after retry/backpressure; guard_eid is required for a guard/fact pair and nullable otherwise; source_kind and source_event_id preserve source identity; t_publish is source_timestamp for Movement and terminal_publication_time for Burst; deadline = t_publish + T_hearing for hearing work; older queued work remains and rejected work creates no relay or decision
    - name: peer-recruit
      fields: [session_id, attempt_epoch, entry_id, fact_id, source_guard, area_position, timestamp, target_guard, acknowledgement, arrival_deadline, publisher]  # Target-only FSM corroboration decision; eligibility/acknowledgement/arrival deadline are required once Alert Propagation exists
    - name: locked-zone
      fields: [session_id, attempt_epoch, entry_id, fact_id, source_guard, area_position, timestamp, patrol_area_id, expiry_timestamp, publisher]  # Target-only FSM corroboration decision; zone lifetime is explicit, no duplicate investigate-commit
    - name: Threshold crossing (confirm-window start)
      fields: [entry_id, R, threshold_state, timestamp, publisher]  # numeric R added in v2; publisher = sensing-fact
    - name: Confirm-window elapsed
      fields: [entry_id, R, threshold_state, timestamp, publisher]  # rev 3.2: window reached t_win with LOS — the sensing fact that IS the threshold-path commit trigger; publisher = sensing-fact
    - name: Liveness fact
      fields: [session_id, attempt_epoch, guard_eid, entry_id, tier, op, cause, position, position_source, source_timestamp, timestamp, evaluated_at, publisher]
    - name: Escalation (investigate-commit, every path)
      fields: [session_id, attempt_epoch, guard_eid, entry_id, fact_id, R, residual_at_commit, evaluated_at, noise_anchor_position, cause, position, threshold_state, source_kind, source_event_id, t_publish, terminal_publication_time, timestamp, hide_entry, publisher, episode_anchor_session_id, episode_anchor_guard_eid, episode_anchor_fact_id, episode_anchor_t_publish, target_position, target_seed, target_sample_index, target_resolution]  # R/residual/timestamp are carried in the sensing-fact preamble; Position is the episode anchor and target_position is the actual navigation target; the FSM never queries Perception synchronously; entry_id/fact_id are relayed, never allocated here; terminal_publication_time is Burst-only and not_applicable for Movement
    - name: Noise re-anchor
      fields: [session_id, attempt_epoch, guard_eid, entry_id, episode_anchor_kind, episode_anchor_identity, episode_anchor_position, episode_anchor_t_publish, episode_anchor_fact_id, corroborating_fact_id, origin, source_kind, source_event_id, t_publish, terminal_publication_time, residual_at_hearing, reanchor_extension_s, timestamp, publisher]  # FSM-owned MVP same-episode corroboration decision; retains entry_id and does not open liveness again; non-noise anchors use entry identity and authored position/time without fabricating a fact id
    - name: Suppressed receipt
      fields: [session_id, attempt_epoch, guard_eid, fact_id, entry_id, suppression_reason, visible_to_player, visibility_query_id, visibility_query_provenance, micro_tell_emitted, source_kind, source_event_id, t_publish, timestamp, publisher]  # FSM-owned immutable consumption receipt; reason ∈ cooldown|out-of-window|out-of-area|state-exclusion; visibility is provenance, not a reason; dedup key is (session_id, attempt_epoch, guard_eid, fact_id)
    - name: Cap-reached
      fields: [entry_id, counter, position, timestamp, publisher]  # rev 3.2: cancel counter hit n_cancel_cap — a sensing fact, never an escalation; the FSM commits cause=cap-forced on this fact; publisher = sensing-fact
    - name: Reachability
      fields: [entry_id, guard, position, reachable, path_arrival_m, delta_y_m, timestamp, publisher]  # rev 3.3 (J2): Perception's un-gated per-tick reachable|unreachable verdict — ONE verdict set feeding the F2 Chase-cap, the R15 give-up predicate, and (via the FSM) the catch-gate geometry; |delta_y| beyond delta_y_tolerance -> unreachable; publisher = sensing-fact; consumed by Guard AI FSM
    - name: Chase-reached
      fields: [entry_id, R, threshold_state, position, timestamp, publisher]  # Perception's own accumulator fact (A >= T_chase with LOS) — publisher = sensing-fact; never an escalation (the FSM decides)
    - name: Chase-entry
      fields: [entry_id, cause, threshold_state, position, timestamp, paired_chase_reached, publisher]  # rev 3.3 (J1): the FSM's Chase-escalation DECISION record — Euclid grades THIS as the Chase escalation; the meter's Chase row triggers on it (A/R freeze on ALL Chase paths incl. hide-entry + carve-out); cause: threshold | hide-entry; paired to its chase-reached sensing precursor; publisher = FSM-decision
    - name: Chase-end
      fields: [entry_id, guard, timestamp, publisher]  # FSM publishes (R12); resumes R decay; Chase-tier Captures imply Chase-end (rev 3.2, scoped rev 3.9 CR-PERCEPTION-01) — witnessed Investigate-tier interior-inspection Captures publish Capture ALONE and exit the meter to Idle without a paired Chase-end
    - name: Investigate-resolution
      fields: [session_id, attempt_epoch, entry_id, cause, position, timestamp, publisher]  # cause: fruitless | sight-committed | cap-forced | capture | redirected | abandoned; fruitless -> F6 residual share
    - name: Capture
      fields: [entry_id, position, victim, carve_out, timestamp, publisher]  # carve_out: any spot-verification capture (Chase-tier spot-front capture OR witnessed either-tier interior-inspection capture) consumes ONE Chase-COUNT escalation slot per spot-verification incident (concept line 120, amended CR-CONCEPT-01 completion rev 3.9; incident delimiter = episode-scoped, CR-CONCEPT-02 rev 3.10 — closes when its episode(s) resolve, later witnessed dive = new incident + own slot); a carve_out Capture at the Investigate tier publishes Capture ALONE — no Chase-entry/Chase-end (rev 3.9 CR-PERCEPTION-01); Grade-GDD TODO: consumption of the witnessed-entry counting rule lands with the Suspicion Meter / Grade GDD
    - name: Movement-state transition
      fields: [from_state, to_state, timestamp, publisher]  # Player Controller event; at most one per tick after snapshot rebuild; same-frame inputs carry only the net pair; publisher = Player Controller
    - name: step_event
      fields: [session_id, attempt_epoch, step_id, stride_target_state, state, previous_position, position, stride_length_m, ledger_remainder_m, timestamp, publisher]  # Player Controller event; stride_target_state is the latched radius source; at most one per tick; duplicate source identity is ignored; publisher = Player Controller
    - name: Pickup interaction
      fields: [session_id, attempt_epoch, interaction_id, pickup_id, trigger, reachable, distance_within_reach, clear_linecast, telemetry_event, telemetry_only, timestamp, publisher]  # LevelFixture evidence; pickup-reached is telemetry only and Interact owns the state change
    - name: Pickup state transition
      fields: [session_id, attempt_epoch, transition_id, interaction_id, pickup_id, from_state, to_state, spend_committed, fact_id, noise_published, timestamp, publisher]  # explicit Placed → Carried ownership record; pickup itself is silent
    - name: Gate state transition
      fields: [session_id, attempt_epoch, transition_id, gate_marker_id, owner, from_state, to_state, trigger_event, trigger_noise_kind, trigger_decision_id, causal_fact_id, landing_fact_id, step_id, causal_entry_id, timestamp, publisher]  # Level-owned typed transition; trigger_noise_kind ∈ {movement, burst} self-identifies the trigger stream and the responsible source id is landing_fact_id for Burst or step_id for Movement; causal identity must match the noise Investigate decision
    - name: HideSpot occupied
      fields: [session_id, attempt_epoch, hide_spot_id, interior_position, occupied, transition_id, timestamp, publisher]  # player-movement-hide #5: typed raw occupancy event on capsule entry to an Empty spot, exactly once per continuous occupancy; consumed by Perception R4 (LOS-invisibility) + FSM hide-dive detection (CR-FSM-01b); transition_id is the immutable HideSpot-owned transition identity, stable across retries and bus handoff; occupied=true is the current raw state only; no entry_id or witnessed authority is carried or allocated; Perception derives entry_id and witnessed-entry authority from its own sensing evidence; publisher = HideSpot
    - name: HideSpot empty
      fields: [session_id, attempt_epoch, hide_spot_id, interior_position, occupied, transition_id, timestamp, publisher]  # player-movement-hide #5: typed raw occupancy event flushed synchronously on capsule exit before any FSM capture check (D3 — relocation-window escape / no-false-capture ordering); the ONLY writer of spot state Empty (player-occupancy-authoritative); transition_id is the immutable HideSpot-owned transition identity, stable across retries and bus handoff; occupied=false is the current raw state only and never permits Capture; no entry_id or witnessed authority is carried or allocated; Perception derives entry_id and witnessed-entry authority from its own sensing evidence; publisher = HideSpot
    - name: Trace markers (behavioral, non-decision)
      fields: [marker_name, entry_id, timestamp, publisher]  # trace-only FSM behavioral markers — NOT decisions: never touch tier-scoped suppression or grading; Telemetry-visible only (rev 3.9 CR-PERCEPTION-01 registration). Known markers: postchase-sweep (rev 3.5, post-Chase LKP sweep beat); suppressed-hide-fallback (rev 3.9 C1.0 — emitted when ranks 1-3 win over the rank-4 sub-threshold hide-entry fallback, making the bounded supersession cell triageable in playtest)
