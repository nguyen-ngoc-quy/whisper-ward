  invariants:
    root_policy: minimum_strictly_positive
    root_policy_proof: "Two-regime proof (rev 2026-08-30; threshold ϵ_t rev 2026-09-19 — the prior 'at most one strictly positive member unless D = 0' claim is STRUCK as false). Roots t_minus = (v0·sinθ − √D)/g and t_plus = (v0·sinθ + √D)/g with D > 0. Regime 1 (Δy ≥ 0, landing at or below release): product of roots = −2Δy/v0²cos²θ ≤ 0, so at most one root is strictly positive — the descending crossing t_plus — and it exists because the trajectory starts at the release height with upward velocity. Regime 2 (Δy < 0, landing above release and below the apex): both roots are strictly positive (ascending and descending crossings of the elevated landing plane); the minimum rule selects the ASCENDING crossing t_minus. D = 0: one repeated root accepted exactly if it is strictly positive. D < 0: reject. Roots at or below ϵ_t (where ϵ_t = Δt_tick = 1/120 s ≈ 0.00833 s, rev 2026-09-19; eliminating flat-ground float rounding degeneracy t_- ≈ +10⁻¹⁶ > 0) are always discarded. UNIQUENESS COMES FROM THE MIN-SELECTION RULE, NOT FROM ROOT COUNT — the policy 'select the minimum strictly positive root exceeding ϵ_t' is deterministic in every regime because the selected value is unique among the filtered candidates, even when two candidates exist."
    valid_angle_domain: "Global cap 0° < theta ≤ 45°; every authored volume also requires theta_deg ∈ band_reachable_theta_domain_deg"
    f4_range_m: "[8, 12] for every authored valid throw volume; band_reachable_theta_domain_deg records the certified sub-domain"
    reserve_after_failed_gate_spend: "Placed and reachable after wall, ceiling, void, and death cases"
    mvp_response: Investigate
    target_only_responses_rejected: [peer-recruit, locked-zone]
    actual_capture_required: true
    uncaptured_is_pass: false
    nominal_radius_only_is_pass: false
    f4_validator_ownership: "Global BurstThrowConfig validates angle, discriminant/root, and loaded R_actual range; LevelFixtureValidator validates authored geometry, endpoint heights, placement/collision ambiguity, and runtime/preview/fixture parity. Neither validator treats UNCAPTURED as PASS."
    authored_grazing_ownership: "LevelFixtureValidator alone rejects tangent/edge/zero-clearance/ambiguous authored physical contacts with AUTHORED_GRAZING_GEOMETRY_REJECTED after F4 math validation; a finite positive D=0 repeated root remains mathematically valid unless the authored geometry independently grazes."
    target_marker_semantics: "In the MVP fixture, valid_throw_volumes.target_marker_id identifies the logical gate-entry objective opened by the resulting Noise/Investigate chain; it is not a physical landing-point assertion. Physical landing is certified by launch_position, launch_direction_xz, landing_surface_id, landing_surface_y_m, open_volume_bounds, F4 range, collision, and landing_envelope."
    pickup_interaction_ownership: "LevelFixture requires an explicit reachable Interact edge and Placed → Carried state record; pickup-reached remains telemetry-only and pickup does not publish NoisePublished."
    gate_transition_ownership: "Level owns the typed gate transition; causal session/epoch/fact/entry identities must match the noise Investigate decision before gate exit reachability can pass."
    receiver_endpoint_ownership: "Playable MVP receiver probes use real_guard_endpoint tied to guard_mvp_01; synthetic endpoints are test-only and never substitute for the guard eye."
    death_epoch_barrier: "failed_death_01 increments attempt_epoch exactly once, cancels the in-flight spend without refund, and rejects all late prior-epoch callbacks/work before fact, relay, decision, or audio presentation."
    gate_negative_on_invalid_landing: "Only a CERTIFIED positive-throw landing (valid throw volume, physical World landing surface, in R_eff hearing distance, clear E20 path, guard-reachable investigation) may appear in a gate_transitions causal chain. A guard Investigate decision alone NEVER opens the gate: void, timeout-fallback, off-NavMesh, unreachable, initial-overlap, and death-cancelled landings all publish noise and may cause investigations but are gate-INELIGIBLE, asserted by failed_gate_spends.gate_transition_eligibility=ineligible and gate_state_after_failed_spend=blocked (rev 2026-08-31)."
    receiver_derived_from_landing: "Playable-route receiver probes derive their source position from the captured published landing contact of the same causal chain's throw volume; independently authored synthetic source positions cannot certify the playable MVP route (rev 2026-08-31)."
    teaching_before_spend: "The first Walk and Run teaching demonstrations precede the first Burst-spend beat in teaching_sequence order; every teaching sequence includes a Crouch control case proving no movement fact (rev 2026-08-31)."
    evidence_state_ownership: "LevelFixture owns certification_status and actual evidence state; registry owns schema and stable result-code vocabulary."
  result_codes: [PASS, MISSING_REQUIRED_FIELD, MISSING_MARKER, INVALID_CARDINALITY, INVALID_TOLERANCE, INVALID_F4_RANGE, INVALID_ANGLE, AUTHORED_THETA_OUTSIDE_BAND_DOMAIN, INVALID_SPEED, INVALID_ROOT, INVALID_ROUTE, AMBIGUOUS_COLLISION, AUTHORED_GRAZING_GEOMETRY_REJECTED, INITIAL_OVERLAP_REJECTED, INITIAL_OVERLAP_QUERY_INCOMPLETE, THROW_WHILE_MOVING_REJECTED, BURST_STAND_CLEARANCE_BLOCKED, MOVEMENT_GATE_TRIGGER_REJECTED, EXPECTED_NEGATIVE_CASE, E20_LAYER_MISMATCH, TRIGGER_POLICY_MISMATCH, ACTUAL_CAPTURE_UNAVAILABLE, CONTRADICTORY_RECORD, INVALID_PICKUP_TRANSITION, INVALID_GATE_TRANSITION, GATE_OPENED_BY_INVALID_LANDING, ENDPOINT_MODE_MISMATCH, MISSING_LANDING_SURFACE, EPOCH_BARRIER_MISMATCH, STALE_WORK_NOT_CANCELLED, RESTART_TRANSACTION_MALFORMED, RESTART_NOT_ATOMIC, TEACHING_SEQUENCE_OUT_OF_ORDER, SIGNAL_A_VISIBILITY_UNPROVEN]
  performance_result_codes: [TIMER_BOUNDARY_INVALID]
  result_code_namespaces:
    level_fixture: result_codes
    performance_fixture: performance_result_codes
    note: "TIMER_BOUNDARY_INVALID is a PerformanceFixture diagnostic code, not a LevelFixture result code. It invalidates the sample and cannot satisfy a budget."
  validation_result_mapping:
    ACTUAL_CAPTURE_UNAVAILABLE: "Manifest or any required record remains UNCAPTURED or contains a REQUIRED_RUNTIME_* placeholder."
    GATE_OPENED_BY_INVALID_LANDING: "A void, timeout-fallback, off-NavMesh, unreachable, initial-overlap, or death-cancelled landing appears in a gate_transitions causal chain, or a failed_gate_spends case leaves the gate open/exit reachable (rev 2026-08-31)."
    RESTART_TRANSACTION_MALFORMED: "A restart_transaction record is missing required fields, has unordered steps, or contradicts the full_room_restart_transaction registry entry (rev 2026-08-31)."
    RESTART_NOT_ATOMIC: "A restart transaction applied partially (any of the six ordered steps unverified) — partial application is a failure, not a state (rev 2026-08-31)."
    TEACHING_SEQUENCE_OUT_OF_ORDER: "A teaching_sequence places a Burst-spend beat before the first Walk and Run teaching demonstrations, or omits the Crouch control case (rev 2026-08-31)."
    SIGNAL_A_VISIBILITY_UNPROVEN: "A signal_a_visibility record lacks the guaranteed causal chain (clear vantage LOS, hearing-eligible initial guard state, captured landing source, FSM-tick-bounded orient tell), so the first-session/portfolio causal observation is uncertified (rev 2026-08-31)."
    EXPECTED_NEGATIVE_CASE: "A negative stimulus was accepted, spent, published, or observed with a rejection code different from its expected rejection code."
    MOVEMENT_GATE_TRIGGER_REJECTED: "A Movement noise trigger was presented to a Burst-only gate; the gate remains blocked and the exit remains unreachable without changing Throw admission or spend state."
    AMBIGUOUS_COLLISION: "Two or more authored E20 solids resolve within contact_ambiguity_tolerance_m for one swept contact; Level validation rejects the volume before it can certify a landing."
    INVALID_ROUTE: "A declared receiver patrol-phase window is unresolved or its captured hearable interval is shorter than min_validity_s; the route cannot certify."
    INVALID_ANGLE: "Global BurstThrowConfig rejects theta outside 0° < theta ≤ 45° before launch/spend."
    AUTHORED_THETA_OUTSIDE_BAND_DOMAIN: "LevelFixture rejects an authored theta outside the valid closed band-reachable domain for that volume; this content code is distinct from the global CFG_INVALID_ANGLE/INVALID_ANGLE domain failure."
    INVALID_SPEED: "Level/fixture input has non-positive launch speed; the throw cannot enter F4 evaluation or spend."
    INVALID_ROOT: "Global BurstThrowConfig rejects D < 0 or no strictly positive root before launch/spend; a positive repeated D=0 root is valid math when t_minus=t_plus>0."
    INVALID_F4_RANGE: "Global BurstThrowConfig rejects a positive-root R_actual outside [8,12] m before fixture certification."
    AUTHORED_GRAZING_GEOMETRY_REJECTED: "LevelFixtureValidator rejects tangent, edge, zero-clearance, or ambiguous authored physical contact after the F4 math oracle; it does not reject a positive repeated D=0 root by itself."
    INITIAL_OVERLAP_QUERY_INCOMPLETE: "The bounded initial-overlap query saturated or returned incomplete/invalid enumeration; the throw is rejected fail-closed before spend and no overlap verdict is inferred."
    TIMER_BOUNDARY_INVALID: "PerformanceFixture-only diagnostic code: component timers overlap or leave an unexplained residual beyond the registered timer resolution; the sample is invalid and cannot satisfy a budget. It is not a LevelFixture result code."
    INITIAL_OVERLAP_REJECTED: "Burst launch initial-overlap probe proves overlap and rejects before spend, leaving the pickup Carried."
    THROW_WHILE_MOVING_REJECTED: "Throw rejects before flight-handle allocation and spend when the resolved input edge has a Walk or Run label at any resolved speed, including zero, or when resolved planar speed is greater than zero; the pickup remains Carried and no flight, terminal, audio, or NoisePublished fact is emitted."
    BURST_STAND_CLEARANCE_BLOCKED: "Crouched throw attempt could not stand up due to overhead obstruction within 1.8 m standing height; throw rejected before spend, leaving the pickup Carried."
    INVALID_PICKUP_TRANSITION: "The required reachable Interact edge or typed Placed → Carried state transition is missing, contradictory, or observed with a spend/noise side effect."
    INVALID_GATE_TRANSITION: "The Level-owned gate transition lacks typed before/after states or does not match the causal investigate decision identity/order."
    ENDPOINT_MODE_MISMATCH: "A receiver endpoint mode/source is missing, resolves to the wrong guard endpoint, or uses a synthetic endpoint for playable MVP certification."
    MISSING_LANDING_SURFACE: "A positive throw volume lacks a physical World non-trigger landing solid or its authored landing surface height/contact mode does not match the geometry variant."
    EPOCH_BARRIER_MISMATCH: "A death/reset does not perform the required lifecycle-owned epoch transition or permits prior-epoch work to remain eligible."
    STALE_WORK_NOT_CANCELLED: "A late prior-epoch flight callback or queued item produces collision, timeout, fact, relay, decision, or presented audio after death cancellation."
    PASS: "All required expected/actual fields, geometry, route, identity, and validator assertions pass after capture."
  note: "Level GDD #8 remains provisional. The manifest is a deterministic, non-production fixture; unknown, missing, malformed, contradictory, ambiguous, REQUIRED_RUNTIME_VALUE/HASH, and UNCAPTURED values fail closed. Initial overlap is a no-spend rejection and is distinct from the four consumed gate-pickup failed-spend cases."
  consumed_by: [Player Noise GDD, Level GDD, Perception GDD, sound_performance_audit.md]

