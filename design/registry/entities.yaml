physics_query_contract:
  - name: navmesh_area_mapping_mvp
    value: {Walkable: {area_index: 0, area_mask: 1}}
    safe_range: "locked Unity NavMesh area mapping for the MVP fixture; navmesh_area_mask must equal the OR of resolved named area bits"
    note: "Level route records serialize both navmesh_area_names and navmesh_area_mask plus this mapping id. The validator resolves the name to area index 0 and bit 1 before comparing path results; an unknown name, index, or mask fails closed. This mapping is independent of the E20 Physics layer mask."
    source: design/levels/mvp-burst-route-fixture.md  # route contract normalization 2026-09-09
    owned_by: "LevelFixture / Navigation authoring (Player Noise co-sign)"
    consumed_by: [Player Noise GDD, LevelFixture, design/gdd/perception.md]

  - name: performance_sample_method
    value: {minimum_steady_state_samples: 100, percentile_method: nearest_rank, rank: "ceil(p × N)", hitch_classification: spontaneous_hitch, timer_resolution: registered_platform_timer_resolution}
    safe_range: "minimum_steady_state_samples >= 100; p50/p95/p99 use non-excluded ascending samples; max is the largest non-excluded sample"
    note: "Samples below the minimum are UNCAPTURED. Labeled and spontaneous hitches remain in the hitch ledger and are excluded from steady-state percentiles only with an explicit reason. Component timers are disjoint; overlap or unexplained residual maps to TIMER_BOUNDARY_INVALID."
    source: design/gdd/sound_performance_audit.md  # AC21 methodology normalization 2026-09-09
    owned_by: "PerformanceFixture / sound_performance_audit.md"
    consumed_by: [NoiseFixtureSpec, Player Noise GDD]

  - name: performance_budget_evidence
    value: "{status: PENDING_OQ6, value_ms: null} | {status: CAPTURED, value_ms: finite}"
    safe_range: "PENDING_OQ6 is non-passing; diagnostic_only profiles have required_budget_ms=null and cannot satisfy a gate"
    note: "The current whole-frame acceptance gate is WebGL p95 at 33.0 ms. PC remains a functional/replay target but has no separate millisecond threshold until a hardware profile is registered."
    source: design/gdd/sound_performance_audit.md  # AC21 scope normalization 2026-09-09
    owned_by: "PerformanceFixture / sound_performance_audit.md"
    consumed_by: [NoiseFixtureSpec, Player Noise GDD]

  - name: E20_layer_manifest
    required_names: [World]
    forbidden_names: [Player, Guard, trigger]
    validation: "Resolve each required name via LayerMask.NameToLayer(name) ≥ 0 at init; fail load if any returns −1 (layer missing — so its bit is trivially 0 and cannot falsely fail the forbidden-layer check), a forbidden layer bit (Player/Guard/trigger) is set, or the assembled mask is 0 (no required solid layer bit present). QueryTriggerInteraction.Ignore is mandatory for hearing, vision, pickup reach, and Burst collision."
    note: "Resolve each exact project layer name ONCE at init via `LayerMask.NameToLayer(name)` and assert `≥ 0` (fail load if any returns −1 — the layer is missing); assemble the mask, assert it != 0, and assert no forbidden-layer bit (`Player`, `Guard`, `trigger`) is set; cache the resulting mask and never rebuild it per physics query. `LayerMask.GetMask` is avoided: exact `NameToLayer` resolution lets initialization validate every required name, reject a missing layer explicitly, assemble one cached mask, and avoid per-query resolution (player-noise behavioral revision 2026-08-28: WebGL allocation reduction + explicit caller validation; E20 correctness tightened fresh-session re-review 2026-08-28)."
    source: design/gdd/player-noise.md  # E20 contract-hardening revision 2026-08-28
    owned_by: "Physics GDD / Player Noise co-sign"
    consumed_by: [Player Noise GDD, Perception GDD, Level GDD]
  - name: HideSpotContainmentProfile
    required_names: [HideSpot]
    forbidden_names: [Player, Guard]
    validation: "Resolve the exact HideSpot layer via LayerMask.NameToLayer(name) ≥ 0 at initialization; fail load if it is missing, the dedicated mask is zero, or Player/Guard bits are present. The profile is validated by the same physics service but remains a dedicated containment mask; it is never merged into or substituted for E20Mask."
    query_trigger_policy: QueryTriggerInteraction.Collide
    purpose: "Capsule-containment checks may inspect authored HideSpot trigger volumes only. QueryTriggerInteraction.Collide is an explicit containment exception; hearing, vision, pickup reach, and Burst collision continue to use E20Mask with QueryTriggerInteraction.Ignore."
    not_shared_sensing_mask: true
    source: docs/architecture/adr-0002-physics-collision-contract.md  # dedicated HideSpot containment profile
    owned_by: "Physics GDD / Player Movement & Hide co-sign"
    consumed_by: [Player Movement & Hide GDD, Perception GDD, Level GDD]

hide_spot_contract:
  source: design/gdd/player-movement-hide.md  # HideSpot occupancy and witness/approach contract
  canonical_producer: design/gdd/player-movement-hide.md
  raw_occupancy:
    event_types: [HideSpot occupied, HideSpot empty]
    fields: [session_id, attempt_epoch, hide_spot_id, interior_position, occupied, transition_id, timestamp, publisher]
    identity_key: [session_id, attempt_epoch, hide_spot_id, transition_id]
    transition_id: "HideSpot-owned immutable identity allocated once for an actual Empty ↔ Occupied transition; retries and duplicate trigger callbacks reuse it or are ignored, and no transition id is allocated for a non-transition."
    state_authority: "The raw event retains the current player-occupancy state only. Perception derives entry_id and witnessed_entry_authority from occupancy plus its own sensing evidence; the raw event never carries, allocates, or grants either value."
  witness_approach_sampler:
    mode: finite-conservative-union
    input_fields: [hide_spot_id, guard_eid, approach_sample_id, approach_position, approach_forward_xz, approach_time_s, entrance_position, spot_front_anchor, hold_vector, hold_position, eps_arrive]
    constraints: "Every witness/approach sample set is finite, non-empty for a witnessable spot, and contains finite positions, directions, and times. The certified witness set is the conservative union of all eligible guard/approach samples that can cover the entrance during dive time or approach transit plus t_spotfront_verify; omitted samples cannot be treated as proof of non-witnessability."
    evidence_owner: "Level/HideSpot authoring owns the finite input set and certification evidence; Perception owns runtime witnessed-entry classification."
  authored_vectors:
    - name: hold_vector
      value: "Level/hide-system-authored per hide spot"
      safe_range: "Finite normalized outward XZ vector from spot_position through spot_front_anchor"
      source: design/gdd/player-movement-hide.md  # D1 / AC10
      owned_by: "Level / hide system (authored per spot)"
      consumed_by: [Guard AI FSM GDD, Level GDD, Hide System GDD]
    - name: hold_position
      value: "spot_front_anchor + r_guard * hold_vector"
      safe_range: "Finite world-space vector on the guard-reachable approach surface"
      note: "Derived M4 hold datum used by witness/approach certification; eps_arrive remains the registered scalar XZ arrival tolerance and is not replaced by a vector tolerance."
      source: design/gdd/player-movement-hide.md  # D1 / AC4
      owned_by: "Guard AI FSM GDD / Level co-sign"
      consumed_by: [Guard AI FSM GDD, Level GDD, Hide System GDD]
    - name: aperture_portal_target
      value: "Level/hide-system-authored per hide spot"
      safe_range: "Center of spot entrance portal at height h_portal = min(0.8 m, aperture_height/2) with +0.05 m outward offset along hold_vector"
      note: "Linecast target for D1 backstop reach verification (player-movement-hide #5 §D1, approved 2026-09-20). Outward offset prevents prop-mesh self-occlusion; enclosed props (lockers/wardrobes) provide ApertureVisionWindow for clear linecast."
      source: design/gdd/player-movement-hide.md  # D1
      owned_by: "Level / hide system (authored per spot)"
      consumed_by: [Guard AI FSM GDD, Level GDD, Hide System GDD]

burst_throw:
  - name: BurstThrowConfig.v0
    value: 10.0  # m/s — starter
    safe_range: "raised-origin band [8, 12] m via R = v₀·cosθ·(v₀·sinθ + √((v₀·sinθ)² + 2·g·h_release))/g; unified upright stationary starter v0=10.0 m/s, θ=30°, h_release=1.5 m gives R≈10.93 m (apex=2.77 m, clearing 3.0 m ceilings; Crouch Skip cut)"
    source: design/gdd/player-noise.md  # F4 (rev 2026-09-20 unified upright ballistics)
    owned_by: "Player Noise GDD"
    consumed_by: [Player Noise GDD, Level GDD]
  - name: BurstThrowConfig.theta
    value: 30  # degrees — unified upright stationary starter (rev 2026-09-20)
    safe_range: "global cap 0° < θ ≤ 45°; starter θ=30°; each authored throw volume additionally records a computed band-reachable θ domain where F4 R_actual ∈ [8, 12] m"
    constraint: "Content certification rejects an authored θ outside its volume's recorded band-reachable domain with AUTHORED_THETA_OUTSIDE_BAND_DOMAIN; the domain is computed from the authored v0, h_release, and h_landing and may be a union of closed intervals. This is independent of the global INVALID_ANGLE cap."
    source: design/gdd/player-noise.md  # F4 (rev 2026-09-20 unified upright ballistics)
    owned_by: "Player Noise GDD"
    consumed_by: [Player Noise GDD, Level GDD]
  - name: h_landing
    value: authored_world_space_surface_contact_y
    safe_range: "finite authored world-space Y; MVP flat ground = 0 m; equal-height landing may equal h_release"
    note: "F4 h_landing is the authored world-space Y of the landing surface contact used by the unequal-height ballistic oracle. It is not the published post-push-out projectile-center Y; no runtime height correction is permitted."
    source: design/gdd/player-noise.md  # F4 unequal-height certification
    owned_by: "Player Noise GDD (Level co-sign)"
    consumed_by: [Player Noise GDD, Level GDD, LevelFixture]
  - name: published_projectile_center
    value: "collider_surface_contact + hit_normal × (projectile_radius + epsilon_contact)"
    safe_range: "finite world-space contact position after a valid SphereCast hit"
    note: "This is a separate collision result from h_landing. Runtime, preview, and LevelFixture use the published center for landing/hearing position; projectile_radius is cast-shape geometry, epsilon_contact is post-hit push-out, and contact_ambiguity_tolerance remains Level-only tie certification."
    source: design/gdd/player-noise.md  # F4 collision authority correction
    owned_by: "Player Noise GDD (Physics co-sign)"
    consumed_by: [Player Noise GDD, Physics GDD, Level GDD, LevelFixture]
  - name: ThrowSnapshot
    value: "immutable accepted-edge snapshot shared by runtime, preview, and LevelFixture"
    fields: [session_id, attempt_epoch, flight_handle_id, accepted_edge_timestamp, launch_feet_position, launch_position, resolved_velocity, resolved_stance, camera_azimuth_deg, resolved_facing_azimuth_deg, trajectory_v0_mps, trajectory_theta_deg, throw_release_height_m, projectile_radius_m, source_pickup_id, geometry_variant_id]
    safe_range: "locked field-for-field parity contract; throw_snapshot_id is allocated for an accepted Throw and rejected Throws have no snapshot"
    note: "The canonical immutable field set is {session_id, attempt_epoch, flight_handle_id, accepted_edge_timestamp, launch_feet_position, launch_position, resolved_velocity, resolved_stance, camera_azimuth_deg, resolved_facing_azimuth_deg, trajectory_v0_mps, trajectory_theta_deg, throw_release_height_m, projectile_radius_m, source_pickup_id, geometry_variant_id}. `resolved_velocity` is the authoritative projectile initial velocity vector derived from the captured v0, theta, and azimuth; player movement velocity is not composed into it and any diagnostic player velocity uses a separate non-authoritative field. Runtime, preview, and LevelFixture consume this identical field list field-for-field; no consumer may re-sample the camera, origin, stance, or geometry independently."
    source: design/gdd/player-noise.md  # AC20 ThrowSnapshot parity
    owned_by: "Player Noise GDD"
    consumed_by: [Player Noise GDD, Level GDD, LevelFixture]
  - name: throw_stationary_requirement
    value: true
    safe_range: "resolved planar speed = 0 at the accepted Throw edge; 150 ms input buffer with velocity snap if speed < 1.0 m/s during stick release; Idle or Crouch-Idle with same-tick stand clearance"
    constraint: "Walk/Run Throw edges with speed ≥ 1.0 m/s are rejected before spend. If speed is < 1.0 m/s during stick release within the 150 ms input buffer, the controller snaps velocity to zero, transitions to stationary, and executes the throw without swallowing input. Crouched throw attempts resolve a same-tick stand-up; if overhead clearance to 1.8 m standing height is blocked by an E20 obstacle, the throw is rejected before spend as BURST_STAND_CLEARANCE_BLOCKED."
    source: design/gdd/player-noise.md  # B7 throw input buffer & velocity snap (rev 2026-09-20)
    owned_by: "Player Noise GDD (Player Controller co-sign)"
    consumed_by: [Player Noise GDD, Player Controller GDD, Level GDD]
  - name: input_buffer_window_s
    value: 0.15  # s — stationary throw input buffer window (rev 2026-09-20)
    safe_range: "[0.05, 0.25] s"
    note: "If stick release occurs within this window prior to throw input, player movement speed is sampled against throw_velocity_snap_threshold."
    source: design/gdd/player-noise.md  # B7 / F4
    owned_by: "Player Noise GDD (Player Controller co-sign)"
    consumed_by: [Player Noise GDD, Player Controller GDD]
  - name: throw_velocity_snap_threshold
    value: 1.0  # m/s — stationary velocity snap threshold during stick release (rev 2026-09-20)
    safe_range: "[0.5, 1.5] m/s"
    note: "If player speed is < 1.0 m/s during stick release within input_buffer_window_s, controller snaps velocity to 0 and executes throw without swallowing input. If >= 1.0 m/s, rejects as THROW_WHILE_MOVING_REJECTED."
    source: design/gdd/player-noise.md  # B7 / F4
    owned_by: "Player Noise GDD (Player Controller co-sign)"
    consumed_by: [Player Noise GDD, Player Controller GDD]
  - name: throw_release_height
    value: 1.5  # m — Burst release height above feet for unified upright standing stance (rev 2026-09-20)
    safe_range: "[1.2, 1.8] m"
    note: "Feeds the F4 raised-origin range; unified upright standing release height 1.5 m with θ=30° gives arc apex 2.77 m above feet (2.82 m sphere top), clearing 3.0 m ceilings; Crouch Skip is cut."
    source: design/gdd/player-noise.md  # CR3/F4 (rev 2026-09-20 unified upright ballistics)
    owned_by: "Player Noise GDD"
    consumed_by: [Player Noise GDD, Level GDD]
  - name: projectile_radius
    value: 0.05  # m — Burst collision sphere radius (rev 2026-08-28, blocker 3)
    safe_range: "locked"
    note: "The fixed-radius Burst cast resolves contact at sphere_center + hit_normal × (projectile_radius + epsilon); the same E20 World mask and QueryTriggerInteraction.Ignore apply to every substep."
    source: design/gdd/player-noise.md  # F4 / E20 (behavioral revision 2026-08-28)
    owned_by: "Player Noise GDD"
    consumed_by: [Player Noise GDD, Physics GDD, Level GDD]
  - name: epsilon_contact
    value: 0.001  # m — Burst contact push-out margin
    safe_range: "locked"
    note: "Canonical landing position is collider-surface hit.point plus hit normal × (projectile_radius + epsilon_contact); this value is only post-hit center push-out, not cast travel or tie resolution."
    source: design/gdd/player-noise.md  # F4 / AC9 (specialist revision 2026-08-29)
    owned_by: "Player Noise GDD"
    consumed_by: [Player Noise GDD, Physics GDD, Level GDD]
  - name: contact_ambiguity_tolerance
    value: 0.001  # m — Level-only equal-distance collision tie tolerance
    safe_range: "[0.0005, 0.005] m"
    note: "Content certification fails with AMBIGUOUS_COLLISION when two authored solids resolve within this distance; it is independent of epsilon_contact and never changes runtime SphereCast or landing push-out."
    source: design/gdd/player-noise.md  # F4 content-certification pin 2026-08-29
    owned_by: "Physics GDD (Level co-sign)"
    consumed_by: [Player Noise GDD, Physics GDD, Level GDD, sound_performance_audit.md]
  - name: initial_launch_overlap_probe
    value: "injected PhysicsScene.OverlapSphere(launch_position, projectile_radius, E20_mask, QueryTriggerInteraction.Ignore)"
    safe_range: "exactly one pre-spend launch-clear query with a registered bounded result capacity; saturation/incomplete enumeration fails closed before flight_handle_id allocation and spend"
    note: "The initial-overlap probe is not a swept SphereCast terminal. It uses the injected PhysicsScene, the validated E20 World mask, projectile_radius, and QueryTriggerInteraction.Ignore; its bounded result buffer must distinguish zero hits from saturation, and saturation or incomplete enumeration records INITIAL_OVERLAP_QUERY_INCOMPLETE and fails closed before spend. A proven overlap records INITIAL_OVERLAP_REJECTED, preserves Carried, and emits no flight, terminal, audio, or NoisePublished fact."
    source: design/gdd/player-noise.md  # Throw admission / F4 initial-overlap authority
    owned_by: "Player Noise GDD (Physics co-sign)"
    consumed_by: [Player Noise GDD, Physics GDD, Level GDD, LevelFixture]
  - name: initial_overlap_result_capacity
    value: 64  # colliders — bounded initial-overlap result buffer
    safe_range: "[16, 128] immutable colliders"
    note: "Bounded result capacity for the pre-spend initial-overlap probe. The overlap buffer is sized once at profile construction from this registered value; a probe returning >= capacity reports saturation, which fails closed as INITIAL_OVERLAP_QUERY_INCOMPLETE before flight_handle_id allocation and spend, never silently truncating the enumerated world. The composition root may not resize it per query or per scene."
    source: design/gdd/player-noise.md  # initial-overlap bounded-capacity hardening 2026-09-13
    owned_by: "Player Noise GDD (Physics co-sign)"
    consumed_by: [Player Noise GDD, Physics GDD, Level GDD, LevelFixture]
  - name: epsilon_t
    value: 0.0083333333  # s — 1/120 s analytical root rejection threshold
    safe_range: "locked at Δt_tick = 1/120 s"
    note: "Sub-tick threshold for F4 root selection: roots with t ≤ ϵ_t are discarded, and the minimum strictly positive root exceeding ϵ_t is selected. Eliminates the IEEE 754 float rounding hazard on flat ground (Δy = 0) where t_- ≈ +10⁻¹⁶ > 0 would otherwise cause an immediate zero-meter detonation at release."
    source: design/gdd/player-noise.md  # F4 root selection threshold (rev 2026-09-19)
    owned_by: "Physics GDD (Player Noise co-sign)"
    consumed_by: [Player Noise GDD, Physics GDD, Level GDD, BurstSimulationService]
  - name: dt_max
    value: 0.0083333333  # s — 1/120 s maximum Burst integration substep
    safe_range: "locked at 1/120 s"
    note: "Burst simulation uses integer ticks of exactly dt_max = 1/120 s; fractional accumulated time is retained and never simulated as a final remainder tick. Unity Physics.simulationMode and FixedUpdate are not Burst step authority; the Physics ADR supplies the injected PhysicsScene and one explicit transform sync after authored solids are finalized. The decimal registry value `0.0083333333` is the serialized representation of the canonical rational 1/120 s; runtime and preview use the fixed-tick definition `1.0f/120.0f`, and config loading asserts equivalence within serialization tolerance so no second dt_max is introduced (player-noise F4 pin, behavioral revision 2026-08-28)."
    source: design/gdd/player-noise.md  # F4 / E19 (behavioral revision 2026-08-28)
    owned_by: "Physics GDD (Player Noise co-sign)"
    consumed_by: [Player Noise GDD, Physics GDD, Level GDD]
  - name: pickup_reach_radius
    value: 1.6  # m — reach radius to arm a Placed Burst (rev 2026-08-27, B7)
    safe_range: "[1.0, 2.5] m"
    note: "The prompt and Interact consume one identical inclusive 3D sphere-plus-occlusion predicate: distance_squared(player_feet, pickup_anchor) ≤ pickup_reach_radius² AND an E20 Linecast from player_feet + up × pickup_reach_origin_offset to pickup_anchor is clear with QueryTriggerInteraction.Ignore. Reachability is the limited-resource re-arm gate; horizontal/vertical component tests, a pickup-specific radius, or a different origin are forbidden."
    source: design/gdd/player-noise.md  # CR3 (re-review rev 2026-08-27, linecast origin rev 2026-09-19)
    owned_by: "Player Noise GDD"
    consumed_by: [Player Noise GDD, Level GDD]
  - name: pickup_reach_origin_offset
    value: 1.2  # m — chest-height linecast origin clearing 0.8 m table surfaces (rev 2026-09-19)
    safe_range: "[1.0, 1.5] m"
    note: "Vertical offset added to player_feet for the F5 pickup reach Linecast query, ensuring line-of-sight to pickups on 0.8 m tables is not blocked by table front edges."
    source: design/gdd/player-noise.md  # F5 pickup reach origin (rev 2026-09-19)
    owned_by: "Player Noise GDD"
    consumed_by: [Player Noise GDD, Level GDD]

guard_noise_response:
  - name: noise_response_profile
    value: MVP  # immutable session behavior profile; Target requires AlertPropagation readiness
    safe_range: "enum: MVP | Target"
    note: "Behavior contract, not a balance knob. MVP requires coordination_service=absent and maps second/third qualifying same-area noise to single-guard re-anchor; Target requires a successful AlertPropagation capability/readiness handshake before play and alone permits peer-recruit/locked-zone decisions. Contradictory profile/service combinations fail validation; no implicit fallback. Record in LevelFixture and replay headers."
    source: design/gdd/player-noise.md  # Pass A AI behavior contract (2026-08-29)
    owned_by: "Player Noise GDD + Guard AI FSM GDD"
    consumed_by: [Player Noise GDD, Perception GDD, Guard AI FSM GDD, Level GDD]
  - name: target_alert_propagation_capability
    value: absent
    safe_range: "enum: absent | present"
    note: "Target profile requires a matching ready capability handshake before the first playable tick; MVP requires absent. Missing, contradictory, or non-ready Target capability fails closed and never falls back to MVP. Record capability id and contract version in fixture/replay headers."
    source: design/gdd/guard-ai-fsm.md  # Pass A revision B (2026-08-29)
    owned_by: "Alert Propagation / Guard AI FSM GDD"
    consumed_by: [Perception GDD, Guard AI FSM GDD, Level GDD]
  - name: target_alert_propagation_contract_version
    value: null
    safe_range: "required non-empty version when profile=Target; null when profile=MVP"
    note: "The version is part of the immutable Target readiness envelope and is validated before first play."
    source: design/gdd/guard-ai-fsm.md  # Pass A revision B (2026-08-29)
    owned_by: "Alert Propagation / Guard AI FSM GDD"
    consumed_by: [Guard AI FSM GDD, Level GDD]
  - name: target_alert_propagation_readiness
    value: not_required
    safe_range: "enum: not_required | ready | not_ready"
    note: "MVP uses not_required with absent capability; Target must use ready with a matching capability and handshake timestamp."
    source: design/gdd/guard-ai-fsm.md  # Pass A revision B (2026-08-29)
    owned_by: "Alert Propagation / Guard AI FSM GDD"
    consumed_by: [Guard AI FSM GDD, Level GDD]
  - name: guard_selection_order
    value: [guard_eid]
    safe_range: "ascending guard_eid only; stable_guard_snapshot_position is recorded data, never a sort key"
    note: "The snapshot position remains available for diagnostics and geometry evaluation but cannot change guard selection order."
    source: design/gdd/player-noise.md
    owned_by: "Perception GDD"
    consumed_by: [Player Noise GDD, Perception GDD, Guard AI FSM GDD, NoiseFixtureSpec]
  - name: noise_same_timestamp_source_order
    value: [source_timestamp, source_event_class_rank, source_event_id]
    safe_range: "locked deterministic tuple; movement rank=0, Burst rank=1"
    note: "Accepted source events with equal timestamps allocate fact_id in this order; listener/thread arrival order is never authoritative. Once fact_id exists, the complete fact and relay ordering tuple appends fact_id, and relay propagation preserves all four fields."
  - name: noise_source_id_validation
    value: typed_namespace_and_suffix_policy
    safe_range: "step:<suffix> for Movement; flight:<positive decimal> for Burst; suffix characters A-Za-z0-9._-; no numeric leading zeroes"
    note: "Ingress rejects empty, wrong-namespace, extra-separator, invalid-character, leading-zero, zero Burst, and nonnumeric Burst identities. This validation precedes fact allocation and hearing admission."
    source: design/gdd/player-noise.md  # Pass A revision B (2026-08-29)
    owned_by: "Player Noise GDD"
    consumed_by: [Player Noise GDD, Perception GDD, Guard AI FSM GDD, Level GDD]
  - name: noise_corroboration_saturation_limit
    value: 3
    safe_range: "locked integer >= 1"
    note: "Only the first three qualifying facts count. Later same-area facts are trace-only until episode resolution and do not re-anchor, extend timers, recruit peers, lock zones, or allocate identities."
    source: design/gdd/guard-ai-fsm.md  # Pass A revision B (2026-08-29)
    owned_by: "Guard AI FSM GDD (Player Noise co-sign)"
    consumed_by: [Player Noise GDD, Perception GDD, Guard AI FSM GDD, Level GDD]

  - name: t_noise_recommit_cooldown
    value: 2.0  # s — post-resolution noise-recommit cooldown (rev 2026-08-27, B11)
    safe_range: "[1.0, 3.0] s"
    note: "After resolution, the FSM drops fresh Noise-heard relays inside this window (single-consumption); while a live episode is open, qualifying same-area facts remain eligible for the registered corroboration/re-anchor path and unrelated or out-of-window facts are consumed without effect. The cooldown starts at Investigate resolution, not Chase-end. Player-noise E18 cross-ref."
    source: design/gdd/guard-ai-fsm.md  # E18 authored (rev 2026-08-27); player-noise.md E18
    owned_by: "Guard AI FSM GDD (Player Noise co-sign)"
    consumed_by: [Guard AI FSM GDD, Player Noise GDD]

  - name: t_noise_micro_tell_rate_limit
    value: 1.0  # s — visible live-episode suppression tell rate limit (standardized rev 2026-09-19)
    safe_range: "[0.5, 2.0] s"
    note: "Limits visible ear-turn/pause micro-tells emitted from suppressed-receipt outcomes. It is presentation gating only and is distinct from t_noise_recommit_cooldown, which starts after Investigate resolution."
    source: design/gdd/guard-ai-fsm.md  # Suppressed-relay receipt contract (2026-09-09, standardized 2026-09-19)
    owned_by: "Guard AI FSM GDD (Player Noise co-sign)"
    consumed_by: [Guard AI FSM GDD, Player Noise GDD]

  - name: r_corroborate_scatter_burst
    value: 0.0  # m — exact acoustic centroid re-anchor for Burst detonations (rev 2026-09-19)
    safe_range: "[0.0, 0.0] m — locked exact"
    note: "Asymmetric corroboration scatter: a Burst detonation provides a sharp acoustic beacon, re-anchoring the guard's search center directly to the exact detonation location without spatial scatter."
    source: design/gdd/player-noise.md  # Core Rule 7 asymmetric scatter (rev 2026-09-19)
    owned_by: "Guard AI FSM GDD (Player Noise co-sign)"
    consumed_by: [Guard AI FSM GDD, Player Noise GDD]

  - name: r_corroborate_scatter_movement
    value: 0.0  # m — exact acoustic centroid re-anchor for footstep corroboration (standardized rev 2026-09-20)
    safe_range: "[0.0, 0.0] m — locked exact"
    note: "Standardized MVP corroboration re-anchoring on exact acoustic centroid (0.0 m) for both Burst detonations and movement footsteps."
    source: design/gdd/player-noise.md  # Core Rule 7 (rev 2026-09-20 standardized exact centroid)
    owned_by: "Guard AI FSM GDD (Player Noise co-sign)"
    consumed_by: [Guard AI FSM GDD, Player Noise GDD]

  - name: t_noise_corroborate_window
    value: 6.0  # s — same-area corroboration window for a guard's noise episode
    safe_range: "[4.0, 8.0] s"
    note: "Target tier: second same-area noise within the window may peer-recruit and third may escalate to locked zone. MVP: without a coordination service, the second/third same-area fact re-anchors the single guard and extends give-up instead. This positive corroboration leg is orthogonal to the single-guard recommit cooldown and must not be debounced."
    source: design/gdd/player-noise.md  # Core Rule 7 / CR7 (behavioral revision 2026-08-28)
    owned_by: "Guard AI FSM GDD (Player Noise co-sign)"
    consumed_by: [Guard AI FSM GDD, Player Noise GDD]
  - name: t_noise_corroborate_radius
    value: 1.5  # m — same-area window for noise corroboration (mirrors r_investigate_error)
    safe_range: "[1.0, 2.5] m"
    note: "Distinct semantic from the FSM's r_investigate_error (investigation-target error): this is the corroboration same-area window — a 2nd/3rd same-area Noise heard within t_noise_corroborate_window and within this radius of the prior noise origin is consumed as corroboration. In MVP it re-anchors the single guard; in Target it may escalate to peer-recruit / locked-zone. Registered separately so FSM retuning of investigation error cannot silently change corroboration (player-noise blocker 10 / re-review 2026-08-28). It is an ALIAS (not a copy) of r_investigate_error — same numeric value, independently registered so the corroboration same-area window and the investigation-target error retune on separate leashes."
    source: design/gdd/player-noise.md  # Core Rule 7 (re-review 2026-08-28)
    owned_by: "Guard AI FSM GDD (Player Noise co-sign)"
    consumed_by: [Guard AI FSM GDD, Player Noise GDD]

  - name: t_noise_reanchor_extend
    value: 2.0  # s — MVP single-guard give-up timer extension on noise re-anchor (fresh-session re-review 2026-08-28, B1 fix)
    safe_range: "[1.0, 4.0] s"
    note: "In MVP (no coordination service) a second/third same-area Noise heard does NOT escalate but re-anchors the live single-guard Investigate to the new raw noise origin with a brief re-orient. The selected budget is t_reanchor = min(t_investigate_max, max(t_remaining, t_reanchor_floor)) where t_reanchor_floor = t_giveup_base × s_diff × (1 + k_thorough × (R_reanchor / R_max)) + this amount (rev 2026-09-20: monotonic budget formula bound per AC15b-MVP), where R_reanchor is relay residual_at_hearing; the clock starts after target/path-end reach. Peer-recruit / locked-zone escalation stays Target-tier only (gated on Alert Propagation). Registered so Level/FSM authors cannot silently drop the MVP re-anchor or residual scaling."
    source: design/gdd/player-noise.md  # CR7/E18 (fresh-session re-review 2026-08-28; monotonic rev 2026-09-20)
    owned_by: "Guard AI FSM GDD (Player Noise co-sign)"
    consumed_by: [Guard AI FSM GDD, Player Noise GDD]

  - name: t_investigate_max
    value: 10.0  # s — maximum investigate give-up ceiling on corroboration re-anchor (rev 2026-09-20)
    safe_range: "[8.0, 15.0] s"
    note: "Monotonic re-anchor budget ceiling: t_reanchor = min(t_investigate_max, max(t_remaining, t_reanchor_floor)). Corroboration deepens suspicion without exceeding the room investigation ceiling."
    source: design/gdd/player-noise.md  # Core Rule 7 / AC15b-MVP (rev 2026-09-20)
    owned_by: "Guard AI FSM GDD (Player Noise co-sign)"
    consumed_by: [Guard AI FSM GDD, Player Noise GDD]

player_noise_budget:
  - name: noise_timing_contract
    value: "t_publish = source_timestamp for Movement; t_publish = terminal_publication_time for a published Burst Collision/Timeout fact; t_publish = not applicable for DeathCancelled"
